                    0 0 < !--=============================--> < !-- PART2: Creators 読み込み & GRID 描画 --> < !--=============================--> <script type="module" >
                    /* Firestore 関連の import は前パートにて済 */

                    let creators=[];
                let currentSort="newest";
                let currentSearch="";
                let currentCategory="";
                let messagesUnsub=null;

                /* -----------------------------------
      Firestore から creators を取得
  ----------------------------------- */
                async function loadCreators() {
                    const snap=await getDocs(collection(db, "creators"));
                    const list=[];

                    snap.forEach(docSnap=> {
                            const d=docSnap.data();

                            list.push({
                                id: docSnap.id,
                                name: d.name || "",
                                company: d.company || "",
                                url: d.url || "",
                                videoTitle: d.videoTitle || "",
                                summary: d.summary || "",
                                profileImageUrl: d.profileImageUrl || "",
                                videoUrl: d.videoUrl || "",
                                categories: Array.isArray(d.categories) ? d.categories : [],
                                likes: typeof d.likes==="number" ? d.likes : 0,
                                works: Array.isArray(d.works) ? d.works : [],
                                createdAt: d.createdAt || null
                            });
                    });

                creators=list;
                rebuildCategoryOptions();
                renderGrid();
            }

            /* -----------------------------------
      カテゴリーの選択肢を再構築
  ----------------------------------- */
            function rebuildCategoryOptions() {
                const sel=$("#categorySelect");
                if ( !sel) return;

                const set=new Set();

                creators.forEach(c=> {
                        (c.categories || []).forEach(cat=> {
                                const t=(cat || "").trim();
                                if (t) set.add(t);
                            });
                    });

                sel.innerHTML='<option value="">すべてのカテゴリ</option>';

                [...set].sort().forEach(cat=> {
                        const opt=document.createElement("option");
                        opt.value=cat;
                        opt.textContent=cat;
                        sel.appendChild(opt);
                    });
            }

            /* -----------------------------------
      並び替え
  ----------------------------------- */
            function sortCreators(list) {
                const arr=list.slice();

                if (currentSort==="name-asc") {
                    arr.sort((a, b)=> (a.name||"").localeCompare(b.name||""));
                }

                else if (currentSort==="name-desc") {
                    arr.sort((a, b)=> (b.name||"").localeCompare(a.name||""));
                }

                else if (currentSort==="oldest") {
                    arr.sort((a, b)=> {
                            const ta=a.createdAt?.toMillis?.() || 0;
                            const tb=b.createdAt?.toMillis?.() || 0;
                            return ta - tb;
                        });
                }

                else {

                    // newest
                    arr.sort((a, b)=> {
                            const ta=a.createdAt?.toMillis?.() || 0;
                            const tb=b.createdAt?.toMillis?.() || 0;
                            return tb - ta;
                        });
                }

                return arr;
            }

            /* -----------------------------------
      GRID の描画
  ----------------------------------- */
            function renderGrid() {
                const grid=$("#grid");
                grid.innerHTML="";

                const s=(currentSearch || "").toLowerCase();

                let filtered=creators.filter(c=> {
                        const nm=(c.name || "").toLowerCase();
                        const cats=Array.isArray(c.categories) ? c.categories : [];

                        const okName= !s || nm.includes(s);
                        const okCat= !currentCategory || cats.includes(currentCategory);

                        return okName && okCat;
                    });

                filtered=sortCreators(filtered);

                if ( !filtered.length) {
                    grid.innerHTML='<div style="padding:20px 0;text-align:center;color:#9ca3af;font-size:13px;">該当するクリエーターがいません。</div>';
                    return;
                }

                filtered.forEach(c=> {
                        const card=document.createElement("div");
                        card.className="card";

                        /* ---------- サムネ ------------- */
                        const tw=document.createElement("div");
                        tw.className="thumb-wrap";

                        if (c.profileImageUrl) {
                            const img=document.createElement("img");
                            img.src=c.profileImageUrl;
                            img.alt=c.name || "thumbnail";
                            img.className="thumb";
                            tw.appendChild(img);
                        }

                        else {
                            const fb=document.createElement("div");
                            fb.className="thumb-fallback";
                            tw.appendChild(fb);
                        }

                        const title=document.createElement("div");
                        title.className="thumb-title";
                        title.textContent=c.videoTitle || c.name || "Untitled";
                        tw.appendChild(title);

                        /* ---------- 本文 ------------- */
                        const body=document.createElement("div");
                        body.className="card-body";

                        if (Array.isArray(c.categories) && c.categories[0]) {
                            const chip=document.createElement("div");
                            chip.className="category-chip";
                            chip.textContent=c.categories[0];
                            body.appendChild(chip);
                        }

                        const nameEl=document.createElement("div");
                        nameEl.className="creator-name";
                        nameEl.textContent=c.name || "—";

                        const compEl=document.createElement("div");
                        compEl.className="creator-company";
                        compEl.textContent=c.company || "";

                        /* ---------- footer（いいね） ----- */
                        const footer=document.createElement("div");
                        footer.className="card-footer";

                        const likesLabel=document.createElement("span");

                        likesLabel.textContent=`$ {
                            c.likes
                        }

                        ♥`;

                        const likeBtn=document.createElement("button");
                        likeBtn.className="like-btn";
                        likeBtn.innerHTML='<span class="heart">👍</span> いいね';

                        likeBtn.addEventListener("click", async (e)=> {
                                e.stopPropagation();

                                try {
                                    await updateDoc(doc(db, "creators", c.id), {
                                        likes: increment(1)
                                    });
                                c.likes +=1;

                                likesLabel.textContent=`$ {
                                    c.likes
                                }

                                ♥`;
                            }

                            catch (err) {
                                console.error(err);
                                alert("いいねの送信に失敗しました");
                            }
                        });

                    footer.appendChild(likesLabel);
                    footer.appendChild(likeBtn);

                    body.appendChild(nameEl);
                    body.appendChild(compEl);
                    body.appendChild(footer);

                    card.appendChild(tw);
                    card.appendChild(body);

                    /* DETAIL を開く */
                    card.addEventListener("click", ()=> openDetail(c));

                    grid.appendChild(card);
                });
        }

        import {

        from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            setDoc,
            addDoc,
            deleteDoc,
            serverTimestamp,
            query,
            orderBy
        }

        from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        import {
            getStorage,
            ref,
            uploadBytes,
            getDownloadURL
        }

        from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

        /* ---------- Firebase 初期化 ---------- */
        const firebaseConfig= {
            apiKey: "AIzaSyAA97KPsLsnHUg5G8Rtb7-3CwMJ1oynkVs",
                authDomain: "play-create-live.firebaseapp.com",
                projectId: "play-create-live",
                storageBucket: "play-create-live.firebasestorage.app",
                messagingSenderId: "143889321354",
                appId: "1:143889321354:web:3c2d16f5fd928ba10e0c73",
        }

        ;

        const app=initializeApp(firebaseConfig);
        const db=getFirestore(app);
        const storage=getStorage(app);

        const $ =(s)=>document.querySelector(s);

        /* ---------- DOM ---------- */
        const creatorListEl=$("#creatorList");
        const newCreatorBtn=$("#newCreatorBtn");
        const saveBtn=$("#saveBtn");
        const deleteBtn=$("#deleteBtn");
        const clearChatBtn=$("#clearChatBtn");
        const previewBtn=$("#previewBtn");

        const nameInput=$("#nameInput");
        const companyInput=$("#companyInput");
        const urlInput=$("#urlInput");
        const videoTitleInput=$("#videoTitleInput");
        const summaryInput=$("#summaryInput");
        const categoryInput=$("#categoryInput");

        const profileImageInput=$("#profileImageInput");

        const videoTypeSel=$("#videoType");
        const videoFileRow=$("#videoFileRow");
        const videoFileInput=$("#videoFile");
        const videoUrlRow=$("#videoUrlRow");
        const videoUrlInput=$("#videoUrlInput");

        const worksListBox=$("#worksList");
        const worksFilesInput=$("#worksFilesInput");
        const worksUrlsInput=$("#worksUrlsInput");

        /* ---------- 状態 ---------- */
        let creators=[];
        let currentId=null;
        let currentDoc=null;

        /* ---------- 動画タイプ自動判別 ---------- */
        function detectVideoTypeFromUrl(url){
        if ( !url) return "";
        const u=url.toLowerCase();
        if (u.includes("youtu.be") || u.includes("youtube.com")) return "youtube";
        if (u.includes("vimeo.com")) return "vimeo";
        if (u.includes("firebasestorage") || u.endsWith (".mp4") || u.endsWith (".mov")) return "file";
        return "";
        }

        function onVideoTypeChange() {
            const type=videoTypeSel.value;
            videoFileRow.style.display=type==="file" ? "block": "none";
            videoUrlRow.style.display=(type==="youtube" || type==="vimeo") ? "block": "none";
        }

        videoTypeSel.addEventListener("change", onVideoTypeChange);

        /* ---------- クリエイター一覧 ---------- */
        async function loadCreators() {
            const snap=await getDocs(collection(db, "creators"));
            creators=[];

            snap.forEach(docSnap=> creators.push({
                    id: docSnap.id, data: docSnap.data()
                }));
        creators.sort((a, b)=> (a.data.name || "").localeCompare(b.data.name || ""));
        renderCreatorList();
        }

        function renderCreatorList() {
            creatorListEl.innerHTML="";

            creators.forEach(c=> {
                    const item=document.createElement("div");
                    item.className="list-item";
                    item.dataset.id=c.id;

                    item.innerHTML=` <div class="name" >$ {
                        c.data.name || "(無名)"
                    }

                    </div> <div class="company" >$ {
                        c.data.company || ""
                    }

                    </div> `;
                    item.addEventListener("click", ()=> selectCreator(c.id));
                    creatorListEl.appendChild(item);
                });
            markActive(currentId);
        }

        function markActive(id) {
            [...creatorListEl.children].forEach(el=> {
                    el.classList.toggle("active", el.dataset.id===id);
                });
        }

        /* ---------- フォーム初期化 ---------- */
        function clearForm() {
            currentId=null;
            currentDoc=null;
            markActive(null);

            nameInput.value="";
            companyInput.value="";
            urlInput.value="";
            videoTitleInput.value="";
            summaryInput.value="";
            categoryInput.value="";

            videoTypeSel.value="";
            videoFileInput.value="";
            videoUrlInput.value="";
            onVideoTypeChange();

            worksFilesInput.value="";
            worksUrlsInput.value="";
            renderWorksEditor([]);
        }

        /* ---------- WORKS 編集UI ---------- */
        function renderWorksEditor(works) {
            worksListBox.innerHTML="";

            if ( !works || !works.length) {
                worksListBox.classList.add("works-empty");
                worksListBox.textContent="まだ登録された WORKS はありません。";
                return;
            }

            worksListBox.classList.remove("works-empty");

            works.forEach((w, idx)=> {
                    const row=document.createElement("div");
                    row.className="work-row";

                    row.innerHTML=` <div class="work-row-top" > <input class="work-title-input" value="${w.title || " "}" > <div class="work-type-label" >$ {
                        w.type || "video"
                    }

                    </div> <input class="work-url-input" value="${w.url || " "}" > <button class="work-delete-btn" >削除</button> </div> <textarea class="work-desc-input" placeholder="説明…" >$ {
                        w.description || ""
                    }

                    </textarea> `;

                    // 削除ボタン
                    row.querySelector(".work-delete-btn") .addEventListener("click", ()=> row.remove());

                    worksListBox.appendChild(row);
                });
        }

        function readWorksFromEditor() {
            const rows=worksListBox.querySelectorAll(".work-row");
            const arr=[];

            rows.forEach(row=> {
                    const title=row.querySelector(".work-title-input").value.trim();
                    const url=row.querySelector(".work-url-input").value.trim();
                    const type=row.querySelector(".work-type-label").textContent.toLowerCase();
                    const desc=row.querySelector(".work-desc-input").value.trim();

                    if ( !url) return;

                    arr.push({
                        title, url, type, description: desc
                    });
            });
        return arr;
        }

        /* ---------- クリエイター選択 ---------- */
        async function selectCreator(id) {
            const c=creators.find(x=> x.id===id);
            if ( !c) return;

            currentId=id;
            currentDoc=c.data;
            markActive(id);

            nameInput.value=c.data.name || "";
            companyInput.value=c.data.company || "";
            urlInput.value=c.data.url || "";
            videoTitleInput.value=c.data.videoTitle || "";
            summaryInput.value=c.data.summary || "";

            // カテゴリはカンマ区切りで編集
            categoryInput.value=Array.isArray(c.data.categories) ? c.data.categories.join(", "): "";

            // メイン動画
            const v=c.data.videoUrl || "";
            const type=detectVideoTypeFromUrl(v);
            videoTypeSel.value=type;

            if (type==="file") {
                videoUrlInput.value="";
            }

            else {
                videoUrlInput.value=v;
            }

            videoFileInput.value="";
            onVideoTypeChange();

            // WORKS
            renderWorksEditor(c.data.works || []);
        }

        /* ---------- Storage アップロード ---------- */
        async function uploadProfileImageIfNeeded(creatorId, previousUrl) {
            const file=profileImageInput.files[0];
            if ( !file) return previousUrl || null;

            const ext=(file.name.split(".").pop() || "jpg");

            const r=ref(storage, `creators/$ {
                    creatorId
                }

                /profile.$ {
                    ext
                }

                `);
            await uploadBytes(r, file);
            return await getDownloadURL(r);
        }

        async function uploadMainVideoIfNeeded(creatorId, previousUrl) {
            const type=videoTypeSel.value;
            if ( !type) return null;

            if (type==="file") {
                const file=videoFileInput.files[0];
                if ( !file) return previousUrl || null;
                const ext=(file.name.split(".").pop() || "mp4");

                const r=ref(storage, `creators/$ {
                        creatorId
                    }

                    /main.$ {
                        ext
                    }

                    `);
                await uploadBytes(r, file);
                return await getDownloadURL(r);
            }

            if (type==="youtube" || type==="vimeo") {
                const url=videoUrlInput.value.trim();
                return url || previousUrl || null;
            }

            return previousUrl || null;
        }

        /* ---------- WORKS 追加 ---------- */
        async function buildNewWorksFromInputs(creatorId, currentWorks) {
            const newWorks=[];
            const existing=new Set(currentWorks.map(w=> w.url));

            // ファイル追加
            const files=worksFilesInput.files;

            for (let i=0; i<files.length; i++) {
                const file=files[i];
                const isImg=file.type.startsWith ("image/");
                const ext=(file.name.split(".").pop());
                const base=file.name.replace(/\.[^.]+$/, "");

                const r=ref(storage, `creators/$ {
                        creatorId
                    }

                    /works/$ {
                        Date.now()
                    }

                    _$ {
                        i
                    }

                    .$ {
                        ext
                    }

                    `);
                await uploadBytes(r, file);
                const url=await getDownloadURL(r);

                if (existing.has(url)) continue;

                newWorks.push({
                    title: base, url, type: isImg ? "image" : "video", description:""
                });
            existing.add(url);
        }

        // URL追加
        const lines=(worksUrlsInput.value || "") .split("\n") .map(v=>v.trim()).filter(Boolean);

        for (let i=0; i<lines.length; i++) {
            const url=lines[i];
            if (existing.has(url)) continue;

            let type="video";
            if (url.match(/\.(jpg|jpeg|png|gif|webp|avif)$/i)) type="image";
            if (url.includes("youtu")) type="youtube";
            if (url.includes("vimeo")) type="vimeo";

            newWorks.push({
                title:`WORK $ {
                    i+1
                }

                `, url, type, description:""
            });
        existing.add(url);
        }

        return newWorks;
        }

        /* ---------- 保存処理 ---------- */
        async function saveCreator() {
            const name=nameInput.value.trim();
            if ( !name) return alert("名前は必須です");

            let creatorId=currentId;
            let refDoc;

            const categories=categoryInput.value .split(",") .map(v=>v.trim()) .filter(Boolean);

            if ( !creatorId) {
                const created=await addDoc(collection(db, "creators"), {
                    name,
                    company: companyInput.value.trim(),
                    url: urlInput.value.trim(),
                    videoTitle: videoTitleInput.value.trim(),
                    summary: summaryInput.value.trim(),
                    categories,
                    likes:0,
                    createdAt: serverTimestamp()
                });
            creatorId=created.id;
            refDoc=doc(db, "creators", creatorId);
        }

        else {
            refDoc=doc(db, "creators", creatorId);
        }

        const prev=currentDoc || {}

        ;
        const profileUrl=await uploadProfileImageIfNeeded(creatorId, prev.profileImageUrl);
        const videoUrl=await uploadMainVideoIfNeeded(creatorId, prev.videoUrl);

        const worksFromUI=readWorksFromEditor();
        const newWorks=await buildNewWorksFromInputs(creatorId, worksFromUI);
        const finalWorks=worksFromUI.concat(newWorks);

        const payload= {
            name,
            company: companyInput.value.trim(),
                url: urlInput.value.trim(),
                videoTitle: videoTitleInput.value.trim(),
                summary: summaryInput.value.trim(),
                categories,
                videoUrl,
                works: finalWorks,
                updatedAt: serverTimestamp()
        }

        ;
        if (profileUrl) payload.profileImageUrl=profileUrl;

        await setDoc(refDoc, payload, {
            merge:true
        });

        alert("保存しました");

        await loadCreators();

        currentDoc=(creators.find(c=>c.id===creatorId) || {}).data;
        currentId=creatorId;
        selectCreator(creatorId);
        }

        /* ---------- 削除 ---------- */
        async function deleteCreator() {
            if ( !currentId) return alert("削除対象がありません");
            if ( !confirm("本当に削除しますか？")) return;

            await deleteDoc(doc(db, "creators", currentId));
            alert("削除しました");

            clearForm();
            loadCreators();
        }

        /* ---------- チャット全削除 ---------- */
        async function clearAllChatForCurrentCreator() {
            if ( !currentId) return alert("クリエイターを選択してください");
            if ( !confirm("チャットを全削除しますか？")) return;

            const q=await getDocs(collection(db, "creators", currentId, "messages"));
            const tasks=[];

            q.forEach(d=> {
                    tasks.push(deleteDoc(doc(db, "creators", currentId, "messages", d.id)));
                });
            await Promise.all(tasks);

            alert("チャットを全削除しました");
        }

        /* ---------- プレビュー（index.html?id=xxx） ---------- */
        function previewCreator() {
            if ( !currentId) return alert("保存後にプレビューできます");

            window.open(`index.html?id=$ {
                    currentId
                }

                `, "_blank");
        }

        /* ---------- イベント登録 ---------- */
        newCreatorBtn.onclick=clearForm;
        saveBtn.onclick=saveCreator;
        deleteBtn.onclick=deleteCreator;
        clearChatBtn.onclick=clearAllChatForCurrentCreator;
        previewBtn.onclick=previewCreator;

        /* ---------- 初期読み込み ---------- */
        loadCreators();
        </script></body></html>
