<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <title>EDIT — CREATORS’ GUILD COLLECTIVE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        :root {
            --bg: #020617;
            --panel: #0b1120;
            --card: #020617;
            --border: #111827;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --accent: #ffb457;
            --accent2: #ff8c37;
            --danger: #f97373;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, "Noto Sans JP", sans-serif;
            background: radial-gradient(circle at 0 0, #1f2937, transparent 60%), #020617;
            color: var(--text);
        }

        header {
            padding: 16px 20px 8px;
            border-bottom: 1px solid #111827;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 16px;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        header .sub {
            font-size: 11px;
            color: var(--muted);
        }

        .btn-top {
            border: none;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            cursor: pointer;
            background: #111827;
            color: #e5e7eb;
            border: 1px solid #374151;
        }

        .layout {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            gap: 12px;
            padding: 12px 16px 24px;
        }

        @media (max-width:900px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 18px 40px rgba(0, 0, 0, .6);
            padding: 12px 12px 16px;
        }

        .panel-title {
            font-size: 12px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        /* クリエイター一覧 */
        .list {
            max-height: 70vh;
            overflow-y: auto;
            margin-top: 4px;
            border-radius: 12px;
            border: 1px solid #111827;
            background: #020617;
        }

        .list-item {
            padding: 8px 10px;
            border-bottom: 1px solid #111827;
            font-size: 13px;
            cursor: pointer;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item:hover {
            background: #0f172a;
        }

        .list-item.active {
            background: #1f2937;
            border-left: 3px solid var(--accent);
            padding-left: 7px;
        }

        .list-item .name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .list-item .company {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* フォーム全体 */
        .form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .field-group {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 10px 12px 12px;
        }

        .field-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .field-label {
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .field-note {
            margin: 0;
            font-size: 11px;
            color: #6b7280;
        }

        .field-input {
            width: 100%;
            margin-top: 4px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #020617;
            color: var(--text);
            font-size: 13px;
            outline: none;
        }

        .field-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(255, 180, 87, .4);
        }

        textarea.field-input {
            min-height: 80px;
            resize: vertical;
        }

        select.field-input {
            padding-right: 24px;
        }

        .row-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        @media (max-width:800px) {
            .row-2 {
                grid-template-columns: 1fr;
            }
        }

        .btn-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 6px;
        }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #111827;
            font-weight: 600;
        }

        .btn-ghost {
            background: #020617;
            color: var(--text);
            border: 1px solid #374151;
        }

        .btn-danger {
            background: #7f1d1d;
            color: #fee2e2;
            border: 1px solid #fecaca44;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            color: #d1fae5;
            background: rgba(16, 185, 129, .15);
            border: 1px solid rgba(16, 185, 129, .4);
        }

        .status {
            margin-top: 4px;
            font-size: 11px;
            color: #9ca3af;
            min-height: 14px;
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>EDIT — CREATORS’ GUILD COLLECTIVE</h1>
            <div class="sub">クリエイター情報 & メイン動画 / WORKS の編集画面</div>
        </div>
        <button class="btn-top" onclick="location.href='index.html'">← TOPへ戻る</button>
    </header>

    <main class="layout">
        <!-- 左：クリエイター一覧 -->
        <section class="panel">
            <div class="field-header">
                <div class="panel-title">CREATORS</div>
                <button id="newCreatorBtn" class="btn btn-ghost" type="button">新規作成</button>
            </div>
            <div id="creatorList" class="list"></div>
        </section>

        <!-- 右：編集フォーム -->
        <section class="panel">
            <div class="panel-title">DETAIL / EDIT</div>

            <form class="form" onsubmit="return false;">
                <!-- 基本情報 -->
                <div class="field-group">
                    <div class="field-header">
                        <span class="field-label">基本情報</span>
                        <span id="currentIdLabel" class="field-note"></span>
                    </div>
                    <div class="row-2">
                        <div>
                            <label class="field-label">名前</label>
                            <input id="nameInput" class="field-input" type="text" placeholder="例：Masahiro Kuwamoto" />
