<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PLAY. CREATE. LIVE. — Creator's Voice</title>

    <style>
        :root {
            --bg: #0b0c10;
            --card: #11131aee;
            --border: #ffffff20;
            --text: #eaeef6;
            --muted: #9aa3b2;
            --accent: #ffb457;
            --accent2: #ff8c37;
            --danger: #ff6b6b;
            --radius: 22px;
            --shadow: 0 10px 30px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .04);
            --glow: 0 0 22px #ffb457aa, 0 0 46px #ff8c37aa, 0 0 80px #ff6a00aa;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans JP", sans-serif;
            color: var(--text);
            background: var(--bg);
            overflow-x: hidden;
        }

        /* 背景アニメ */
        #particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(1200px 1200px at 10% 10%, #1b2540 0%, transparent 60%),
                radial-gradient(1000px 900px at 90% 20%, #3b1a4b 0%, transparent 65%),
                radial-gradient(900px 1000px at 50% 100%, #093a47 0%, transparent 55%),
                var(--bg);
        }

        .grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .09;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="120" height="120" filter="url(%23n)" opacity="0.6"/></svg>');
            mix-blend-mode: overlay;
        }

        /* HEADER */
        header {
            padding: 40px 24px 10px;
            text-align: center;
            position: relative;
        }

        .title {
            font-weight: 900;
            letter-spacing: .08em;
            font-size: clamp(28px, 6vw, 64px);
            text-transform: uppercase;
            filter: drop-shadow(0 6px 26px rgba(0, 0, 0, .5));
            animation: float 6.8s ease-in-out infinite, glow 2.6s ease-in-out infinite;
        }

        .subtitle {
            margin-top: 6px;
            font-weight: 300;
            letter-spacing: .14em;
            color: var(--muted);
        }

        /* 解説テキストのアニメーション表示 */
        .jpcopy {
            max-width: 860px;
            margin: 18px auto 28px;
            padding: 16px 18px;
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            font-size: 15.5px;
            line-height: 1.85;
            opacity: 0;
            transform: translateY(14px);
            animation: introCopy .9s ease-out .35s forwards;
        }

        @keyframes introCopy {
            0% {
                opacity: 0;
                transform: translateY(14px);
            }

            60% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                text-shadow: 0 0 18px rgba(255, 180, 87, .3);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }

            100% {
                transform: translateY(0);
            }
        }

        @keyframes glow {

            0%,
            100% {
                text-shadow: var(--glow);
            }

            50% {
                text-shadow: 0 0 10px #ffb45755, 0 0 20px #ff8c3755;
            }
        }

        /* メインレイアウト */
        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }

        .toolbar-label {
            font-size: 12px;
            color: var(--muted);
        }

        .toolbar select,
        .toolbar input[type="search"] {
            background: #050816;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            font-size: 12px;
            outline: none;
        }

        .toolbar input[type="search"] {
            flex: 1 1 140px;
            min-width: 120px;
        }

        .grid {
            margin-top: 4px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        @media (max-width:1024px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width:768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width:520px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* CARD */
        .card {
            position: relative;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: linear-gradient(145deg, #151926dd, #0b101bdd);
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            min-height: 170px;
            transition: transform .18s, box-shadow .18s, border-color .18s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, .55);
            border-color: #ffb45788;
        }

        .card:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .7), 0 0 24px rgba(255, 180, 87, .7);
            border-color: #ffb457cc;
        }

        .thumb-wrap {
            position: relative;
            padding-top: 62%;
            overflow: hidden;
            pointer-events: none;
            /* スマホで背後のカードクリックを奪わない */
        }

        .thumb {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: .45;
            transform: scale(1.03);
            transition: opacity .18s, transform .18s;
        }

        .thumb-fallback {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 0% 0%, #ffb45755, transparent 55%),
                radial-gradient(circle at 100% 100%, #8b5cf655, transparent 55%),
                #101322;
        }

        .card:hover .thumb,
        .card:active .thumb {
            opacity: 1;
            transform: scale(1.06);
        }

        .thumb-title {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 8px 10px 9px;
            background: linear-gradient(to top, rgba(0, 0, 0, .85), transparent);
            font-size: 11px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #fef9c3;
            text-shadow: 0 0 8px rgba(255, 180, 87, .9), 0 0 16px rgba(236, 72, 153, .7);
            pointer-events: none;
            white-no-wrap: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-body {
            padding: 10px 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .creator-name {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .creator-company {
            font-size: 11px;
            color: #9ca3af;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-footer {
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #9ca3af;
        }

        /* スマホでもタップ優先させるいいねボタン */
        .like-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.35);
            cursor: pointer;
            font-size: 12px;
            position: relative;
            z-index: 20;
            pointer-events: auto;
        }

        .like-btn .heart {
            color: #fb7185;
            font-size: 12px;
        }

        /* カテゴリーバッジ */
        .category-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid rgba(96, 165, 250, 0.6);
            background: radial-gradient(circle at 0 0, rgba(96, 165, 250, 0.2), transparent 60%);
            font-size: 11px;
            color: #dbeafe;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.7);
            letter-spacing: .08em;
            text-transform: uppercase;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .category-chip::before {
            content: "◎";
            font-size: 9px;
        }

        /* メニューオーバーレイ */
        .menu-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .88);
            backdrop-filter: blur(18px);
            z-index: 2400;
        }

        .menu-overlay.show {
            display: flex;
        }

        .menu-panel {
            width: min(360px, 90vw);
            border-radius: 20px;
            background: #020617ee;
            border: 1px solid #ffffff22;
            padding: 20px 22px 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .9);
        }

        .menu-panel h2 {
            margin: 0 0 12px;
            font-size: 16px;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-list li a {
            display: block;
            padding: 8px 10px;
            border-radius: 999px;
            border: 1px solid #4b5563;
            background: rgba(15, 23, 42, 0.9);
            color: #e5e7eb;
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
            text-decoration: none;
            text-align: center;
            transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
        }

        .menu-list li a:hover {
            background: linear-gradient(135deg, #ffb457, #ff8c37);
            color: #111827;
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, .5);
        }

        /* ハンバーガーボタン */
        .menu-button {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            z-index: 2350;
            /* ログイン系オーバーレイより下 */
        }

        .menu-button .bar {
            height: 3px;
            border-radius: 999px;
            background: #e5e7eb;
            box-shadow: 0 0 8px rgba(0, 0, 0, .6);
            transition: transform .25s ease, opacity .25s ease, background .25s ease;
        }

        /* 開いた状態で3本線→× に変形 */
        .menu-button.active .bar:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .menu-button.active .bar:nth-child(2) {
            opacity: 0;
        }

        .menu-button.active .bar:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        /* EDITボタン・フッター */
        .edit-bottom-wrap {
            margin-top: 32px;
            display: flex;
            justify-content: center;
        }

        .edit-bottom-btn {
            padding: 10px 18px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #ffb457, #ff8c37);
            color: #111827;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        footer {
            margin: 30px 0 18px;
            text-align: center;
            color: #b8c2d4;
            font-size: 12px;
            opacity: .8;
        }

        /* 管理者用 EDIT ログインオーバーレイ */
        .edit-login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .85);
            backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2600;
        }

        .edit-login-card {
            width: min(360px, 90vw);
            border-radius: 20px;
            background: #0b1120ee;
            border: 1px solid #ffffff22;
            padding: 20px 22px 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .8);
        }

        .edit-login-card h2 {
            margin: 0 0 8px;
            font-size: 16px;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .edit-login-card p {
            margin: 0 0 14px;
            font-size: 12px;
            color: #9ca3af;
        }

        .edit-login-card label {
            display: block;
            margin-top: 10px;
            font-size: 11px;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #cbd5f5;
        }

        .edit-login-card input {
            width: 100%;
            margin-top: 4px;
            padding: 9px 10px;
            border-radius: 10px;
            border: 1px solid #1f2937;
            background: #020617;
            color: #e5e7eb;
            font-size: 13px;
            outline: none;
        }

        .edit-login-card button {
            margin-top: 12px;
            width: 100%;
            padding: 9px 0;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #ffb457, #ff8c37);
            color: #111827;
            font-weight: 600;
            cursor: pointer;
        }

        .edit-login-error {
            font-size: 11px;
            color: #fecaca;
            margin-top: 8px;
            min-height: 16px;
        }

        /* ユーザー用ログインゲート（TOP入場用） */
        .user-login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .9);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2700;
            /* 一番上 */
        }

        .user-login-card {
            width: min(360px, 90vw);
            border-radius: 20px;
            background: #020617ee;
            border: 1px solid #ffffff22;
            padding: 20px 22px 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .9);
        }

        .user-login-card h2 {
            margin: 0 0 8px;
            font-size: 18px;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .user-login-card p {
            margin: 0 0 14px;
            font-size: 12px;
            color: #9ca3af;
        }

        .user-login-card label {
            display: block;
            margin-top: 10px;
            font-size: 11px;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #cbd5f5;
        }

        .user-login-card input {
            width: 100%;
            margin-top: 4px;
            padding: 9px 10px;
            border-radius: 10px;
            border: 1px solid #1f2937;
            background: #020617;
            color: #e5e7eb;
            font-size: 13px;
            outline: none;
        }

        .user-login-card .btn-row {
            margin-top: 14px;
            display: flex;
            gap: 8px;
        }

        .user-login-card button {
            flex: 1;
            padding: 9px 0;
            border-radius: 999px;
            border: none;
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
            cursor: pointer;
        }

        #userLoginBtn {
            background: linear-gradient(135deg, #ffb457, #ff8c37);
            color: #111827;
            font-weight: 600;
        }

        #userSignupBtn {
            background: #111827;
            color: #e5e7eb;
            border: 1px solid #4b5563;
        }

        #userLoginError {
            font-size: 11px;
            color: #fecaca;
            margin-top: 8px;
            min-height: 16px;
        }
    </style>
</head>

<body>
    <canvas id="particles"></canvas>
    <div class="grain"></div>

    <!-- ハンバーガーメニュー -->
    <div id="menuButton" class="menu-button">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>
    <div id="menuOverlay" class="menu-overlay">
        <div class="menu-panel">
            <h2>Creator's Menu</h2>
            <ul class="menu-list">
                <li><a href="#" id="linkMarket">Creator’s Market</a></li>
                <li><a href="#" id="linkAI">Creator’s AI Consulting</a></li>
                <li><a href="#" id="linkGuild">Creator’s Guild Produce</a></li>
            </ul>
        </div>
    </div>

    <!-- ユーザー用ログインゲート -->
    <div id="userLoginOverlay" class="user-login-overlay">
        <div class="user-login-card">
            <h2>WELCOME</h2>
            <p>PLAY. CREATE. LIVE. を利用するには、ユーザーIDでログインしてください。</p>

            <label for="userEmail">メールアドレス（ID）</label>
            <input id="userEmail" type="email" placeholder="you@example.com" />

            <label for="userPassword">パスワード</label>
            <input id="userPassword" type="password" placeholder="パスワード" />

            <div class="btn-row">
                <button id="userLoginBtn">ログイン</button>
                <button id="userSignupBtn">新規登録</button>
            </div>

            <div id="userLoginError"></div>
        </div>
    </div>

    <!-- DETAIL POPUP -->
    <div id="detailOverlay" class="modal-overlay">
        <div class="modal" id="detailModal">
            <div class="modal-head">
                <div style="display:flex; gap:12px; align-items:center;">
                    <div class="avatar" id="detailAvatar"></div>
                    <div>
                        <div id="detailName" style="font-weight:700;font-size:18px;">Creator</div>
                        <div id="detailCompany" style="font-size:12px;color:#9aa3b2;">Company</div>
                        <div id="detailUrl" class="detail-url"></div>
                    </div>
                </div>
                <button class="close" id="detailClose">×</button>
            </div>

            <div class="modal-body">
                <!-- 左：動画＋ニックネーム＋チャット -->
                <div class="video-panel">
                    <video id="detailVideo" controls playsinline></video>
                    <div class="meta-label">Main Video</div>
                    <div class="meta-text" id="detailDesc">—</div>

                    <div class="meta-label" style="margin-top:12px;">NICKNAME</div>
                    <input id="nicknameInput" type="text" placeholder="ニックネーム（必須）" style="width:100%; padding:8px 10px; margin-bottom:8px;
                   border-radius:10px; border:1px solid #1f2937;
                   background:#020617; color:#e5e7eb;">

                    <div class="meta-label">CHAT</div>
                    <div class="comment-section">
                        <div id="commentList" class="comment-list"></div>
                        <div class="comment-input-row">
                            <input id="commentInput" type="text" placeholder="メッセージを入力..." />
                            <button id="commentSend">送信</button>
                        </div>
                    </div>
                </div>

                <!-- 右：ABOUT + WORKS -->
                <div>
                    <div class="detail-about" id="detailAbout">—</div>

                    <div class="meta-label" style="margin-top:12px;">WORKS</div>
                    <div id="worksGroup" class="comment-section">
                        <div id="worksContainer" class="comment-list">
                            <!-- JSで作品カードを差し込む -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- EDIT ログインオーバーレイ（管理者用） -->
    <div id="editLoginOverlay" class="edit-login-overlay">
        <div class="edit-login-card">
            <h2>EDIT LOGIN</h2>
            <p>コンテンツ編集には管理者IDでのサインインが必要です。</p>
            <label for="editLoginEmail">メールアドレス</label>
            <input id="editLoginEmail" type="email" placeholder="admin@example.com" />
            <label for="editLoginPassword">パスワード</label>
            <input id="editLoginPassword" type="password" placeholder="password" />
            <button id="editLoginButton">ログイン</button>
            <div id="editLoginError" class="edit-login-error"></div>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="title">PLAY. CREATE. LIVE.</div>
        <div class="subtitle">Creeds of the Playful Creators.</div>
        <div class="jpc>
