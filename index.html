<script type="text/javascript">
    //<![CDATA[
    document.addEventListener('DOMContentLoaded', function () {
        var menuBtn = document.getElementById('menuButton');
        var menuOverlay = document.getElementById('menuOverlay');
        var detailOverlay = document.getElementById('detailOverlay');
        var detailClose = document.getElementById('detailClose');

        // 念のため、初期状態で非表示にしておく（CSSが読み込まれないケース対策）
        if (menuOverlay) menuOverlay.classList.remove('show');
        if (detailOverlay) detailOverlay.classList.remove('show');

        // ハンバーガーメニュー
        if (menuBtn && menuOverlay) {
            menuBtn.addEventListener('click', function () {
                menuBtn.classList.toggle('active');
                menuOverlay.classList.toggle('show');
                toggleBodyScroll();
            });
            // オーバーレイの空き部分クリックで閉じる
            menuOverlay.addEventListener('click', function (e) {
                if (e.target === menuOverlay) {
                    menuBtn.classList.remove('active');
                    menuOverlay.classList.remove('show');
                    toggleBodyScroll();
                }
            });
        }

        // 詳細モーダル（開く側は data-open-detail を付ける）
        document.addEventListener('click', function (e) {
            var opener = closest(e.target, '[data-open-detail]');
            if (opener && detailOverlay) {
                detailOverlay.classList.add('show');
                toggleBodyScroll();
            }
        });

        // ×ボタンと背景クリックで閉じる
        if (detailClose && detailOverlay) {
            detailClose.addEventListener('click', function () {
                detailOverlay.classList.remove('show');
                toggleBodyScroll();
            });
            detailOverlay.addEventListener('click', function (e) {
                if (e.target === detailOverlay) {
                    detailOverlay.classList.remove('show');
                    toggleBodyScroll();
                }
            });
        }

        // オーバーレイが開いている間は背面スクロールを止める
        function toggleBodyScroll() {
            var open =
                (menuOverlay && menuOverlay.classList.contains('show')) ||
                (detailOverlay && detailOverlay.classList.contains('show'));
            document.body.style.overflow = open ? 'hidden' : '';
        }

        // Element.closest の簡易代替（古いブラウザ向け）
        function closest(el, selector) {
            while (el && el.nodeType === 1) {
                if (matches(el, selector)) return el;
                el = el.parentElement || el.parentNode;
            }
            return null;
        }
        function matches(el, selector) {
            var p = Element.prototype;
            var f = p.matches || p.msMatchesSelector || p.webkitMatchesSelector;
            return f.call(el, selector);
        }
    });
    //]]>
</script>
