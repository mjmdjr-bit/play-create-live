<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PLAY. CREATE. LIVE. — Creator's Voice</title>

    <style>
        :root {
            --bg: #0b0c10;
            --card: #11131aee;
            --border: #ffffff20;
            --text: #eaeef6;
            --muted: #9aa3b2;
            --accent: #ffb457;
            --accent2: #ff8c37;
            --radius: 22px;
            --shadow: 0 10px 30px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .04);
            --glow: 0 0 22px #ffb457aa, 0 0 46px #ff8c37aa, 0 0 80px #ff6a00aa;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, "Noto Sans JP", sans-serif;
            color: var(--text);
            background: var(--bg);
            overflow-x: hidden;
        }

        #particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(1200px 1200px at 10% 10%, #1b2540 0%, transparent 60%),
                radial-gradient(1000px 900px at 90% 20%, #3b1a4b 0%, transparent 65%),
                radial-gradient(900px 1000px at 50% 100%, #093a47 0%, transparent 55%),
                var(--bg);
        }

        .grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .09;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="120" height="120" filter="url(%23n)" opacity="0.6"/></svg>');
            mix-blend-mode: overlay;
        }

        /* ハンバーガーメニュー（見た目だけ） */
        .menu-button {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            z-index: 1000;
        }

        .menu-button .bar {
            height: 3px;
            border-radius: 999px;
            background: #e5e7eb;
            box-shadow: 0 0 8px rgba(0, 0, 0, .6);
        }

        header {
            padding: 40px 24px 10px;
            text-align: center;
        }

        .title {
            font-weight: 900;
            letter-spacing: .08em;
            font-size: clamp(28px, 6vw, 64px);
            text-transform: uppercase;
            filter: drop-shadow(0 6px 26px rgba(0, 0, 0, .5));
            animation: float 6.8s ease-in-out infinite, glow 2.6s ease-in-out infinite;
        }

        .subtitle {
            margin-top: 6px;
            font-weight: 300;
            letter-spacing: .14em;
            color: var(--muted);
        }

        .jpcopy {
            max-width: 860px;
            margin: 18px auto 30px;
            padding: 18px;
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            font-size: 15.5px;
            line-height: 1.85;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }

            100% {
                transform: translateY(0);
            }
        }

        @keyframes glow {

            0%,
            100% {
                text-shadow: var(--glow);
            }

            50% {
                text-shadow: 0 0 10px #ffb45755, 0 0 20px #ff8c3755;
            }
        }

        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .toolbar select,
        .toolbar input[type="search"] {
            background: #050816;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            font-size: 12px;
        }

        .toolbar input[type="search"] {
            flex: 1 1 140px;
            min-width: 120px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-top: 4px;
        }

        @media(max-width:1024px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media(max-width:768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:520px) {
            .grid {
                grid-template-columns: repeat(1, 1fr);
            }
        }

        .card {
            position: relative;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: linear-gradient(145deg, #151926, #0b101b);
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            min-height: 170px;
            transition: .2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, .55);
        }

        .thumb-wrap {
            position: relative;
            padding-top: 62%;
            overflow: hidden;
        }

        .thumb {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: .5;
            transform: scale(1.03);
            transition: .2s;
        }

        .thumb-fallback {
            position: absolute;
            inset: 0;
            background: #111827;
        }

        .card:hover .thumb {
            opacity: 1;
            transform: scale(1.06);
        }

        .thumb-title {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 8px 10px;
            background: linear-gradient(to top, rgba(0, 0, 0, .85), transparent);
            color: #fef9c3;
            font-size: 11px;
            letter-spacing: .12em;
            text-transform: uppercase;
            text-shadow: 0 0 8px #ffb457;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .category-chip {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 999px;
            border: 1px solid #3b82f6;
            background: rgba(59, 130, 246, .15);
            color: #dbeafe;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-bottom: 4px;
        }

        .creator-name {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .creator-company {
            font-size: 11px;
            color: #9ca3af;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #9ca3af;
            margin-top: 6px;
        }

        .like-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, .35);
            cursor: pointer;
            font-size: 11px;
        }

        .edit-bottom-wrap {
            text-align: center;
            margin-top: 30px;
        }

        .edit-bottom-btn {
            padding: 10px 20px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #ffb457, #ff8c37);
            color: #111827;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin: 30px 0;
        }
    </style>
</head>

<body>
    <canvas id="particles"></canvas>
    <div class="grain"></div>

    <!-- ハンバーガーメニューボタン（TOP右上） -->
    <div id="menuButton" class="menu-button">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <!-- HEADER -->
    <header>
        <div class="title">PLAY. CREATE. LIVE.</div>
        <div class="subtitle">Creeds of the Playful Creators.</div>
        <div class="jpcopy">
            遊ぶように発想し、創るように生きる。<br>
            枠にとらわれず、世界を面白がる者たちの信条。<br>
            創造とは、日常を遊びに変えるチカラだ。
        </div>
    </header>

    <!-- MAIN -->
    <main class="container">
        <div class="toolbar">
            <input id="searchInput" type="search" placeholder="名前で検索…" />
            <select id="categorySelect">
                <option value="">すべてのカテゴリ</option>
            </select>
            <span class="toolbar-label">並び順：</span>
            <select id="sortSelect">
                <option value="newest">新着順</option>
                <option value="oldest">古い順</option>
                <option value="name-asc">名前 A→Z</option>
                <option value="name-desc">名前 Z→A</option>
            </select>
        </div>

        <div id="grid" class="grid"></div>

        <div class="edit-bottom-wrap">
            <button class="edit-bottom-btn" onclick="location.href='edit.html'">EDIT</button>
        </div>
    </main>

    <footer>© PLAYFUL CREATORS / Designed by Daijiro Majima</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            updateDoc,
            increment
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAA97KPsLsnHUg5G8Rtb7-3CwMJ1oynkVs",
            authDomain: "play-create-live.firebaseapp.com",
            databaseURL: "https://play-create-live-default-rtdb.firebaseio.com",
            projectId: "play-create-live",
            storageBucket: "play-create-live.firebasestorage.app",
            messagingSenderId: "143889321354",
            appId: "1:143889321354:web:3c2d16f5fd928ba10e0c73",
            measurementId: "G-ZFHF93QQCJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const $ = (s) => document.querySelector(s);

        let creators = [];
        let currentSort = "newest";
        let currentSearch = "";
        let currentCategory = "";

        /* 背景パーティクルだけ残す */
        (function () {
            const canvas = document.getElementById("particles");
            const ctx = canvas.getContext("2d");
            let W, H, dpr = window.devicePixelRatio || 1;
            const palettes = [
                "rgba(255,180,87,0.65)",
                "rgba(72,219,251,0.65)",
                "rgba(129,140,248,0.65)",
                "rgba(45,212,191,0.65)",
                "rgba(244,114,182,0.65)"
            ];
            const color = palettes[Math.floor(Math.random() * palettes.length)];
            function resize() {
                W = canvas.width = innerWidth * dpr;
                H = canvas.height = innerHeight * dpr;
                canvas.style.width = innerWidth + "px";
                canvas.style.height = innerHeight + "px";
            }
            resize();
            addEventListener("resize", resize);
            const parts = [];
            for (let i = 0; i < 90; i++)parts.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: Math.random() * 3 * dpr + 1,
                a: Math.random() * Math.PI * 2,
                v: 0.25 + Math.random() * 0.5
            });
            function draw() {
                ctx.clearRect(0, 0, W, H);
                for (const p of parts) {
                    p.x += Math.cos(p.a) * p.v;
                    p.y += Math.sin(p.a) * p.v;
                    p.a += (Math.random() - 0.5) * 0.03;
                    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
                    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
                    ctx.beginPath();
                    ctx.fillStyle = color;
                    ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

        async function loadCreators() {
            // とりあえず creators を全部読む（orderBy なし・createdAt も使わない）
            const snap = await getDocs(collection(db, "creators"));
            const list = [];
            snap.forEach(docSnap => {
                const d = docSnap.data();
                list.push({
                    id: docSnap.id,
                    name: d.name || "",
                    company: d.company || "",
                    url: d.url || "",
                    videoTitle: d.videoTitle || "",
                    summary: d.summary || "",
                    profileImageUrl: d.profileImageUrl || "",
                    likes: typeof d.likes === "number" ? d.likes : 0,
                    categories: Array.isArray(d.categories) ? d.categories : []
                });
            });
            creators = list;
            rebuildCategoryOptions();
            renderGrid();
        }

        function rebuildCategoryOptions() {
            const sel = $("#categorySelect");
            if (!sel) return;
            const set = new Set();
            creators.forEach(c => {
                (c.categories || []).forEach(cat => {
                    const t = (cat || "").trim();
                    if (t) set.add(t);
                });
            });
            sel.innerHTML = '<option value="">すべてのカテゴリ</option>';
            Array.from(set).sort().forEach(cat => {
                const opt = document.createElement("option");
                opt.value = cat; opt.textContent = cat; sel.appendChild(opt);
            });
        }

        function sortCreators(list) {
            const arr = list.slice();
            if (currentSort === "name-asc") arr.sort((a, b) => a.name.localeCompare(b.name));
            else if (currentSort === "name-desc") arr.sort((a, b) => b.name.localeCompare(a.name));
            // new/old は createdAt 未使用なのでそのまま（将来用）
            return arr;
        }

        function renderGrid() {
            const grid = $("#grid");
            grid.innerHTML = "";
            const s = currentSearch.toLowerCase();
            let filtered = creators.filter(c => {
                const name = (c.name || "").toLowerCase();
                const cats = Array.isArray(c.categories) ? c.categories : [];
                const okName = !s || name.includes(s);
                const okCat = !currentCategory || cats.includes(currentCategory);
                return okName && okCat;
            });
            filtered = sortCreators(filtered);
            if (!filtered.length) {
                grid.innerHTML = '<div style="padding:20px 0;text-align:center;color:#9ca3af;font-size:13px;">該当するクリエイターがいません。</div>';
                return;
            }
            filtered.forEach(c => {
                const card = document.createElement("div");
                card.className = "card";

                const tw = document.createElement("div");
                tw.className = "thumb-wrap";
                if (c.profileImageUrl) {
                    const img = document.createElement("img");
                    img.src = c.profileImageUrl;
                    img.alt = c.name || "thumbnail";
                    img.className = "thumb";
                    tw.appendChild(img);
                } else {
                    const fb = document.createElement("div");
                    fb.className = "thumb-fallback";
                    tw.appendChild(fb);
                }
                const overlay = document.createElement("div");
                overlay.className = "thumb-title";
                overlay.textContent = c.videoTitle || c.name || "Untitled";
                tw.appendChild(overlay);

                const body = document.createElement("div");
                body.className = "card-body";
                if (c.categories[0]) {
                    const chip = document.createElement("span");
                    chip.className = "category-chip";
                    chip.textContent = c.categories[0];
                    body.appendChild(chip);
                }
                const nameEl = document.createElement("div");
                nameEl.className = "creator-name";
                nameEl.textContent = c.name || "—";
                const compEl = document.createElement("div");
                compEl.className = "creator-company";
                compEl.textContent = c.company || "";
                const footer = document.createElement("div");
                footer.className = "card-footer";
                const likesLabel = document.createElement("span");
                likesLabel.textContent = `${c.likes} ♥`;
                const likeBtn = document.createElement("button");
                likeBtn.className = "like-btn";
                likeBtn.textContent = "いいね";
                likeBtn.addEventListener("click", async e => {
                    e.stopPropagation();
                    try {
                        await updateDoc(doc(db, "creators", c.id), { likes: increment(1) });
                        c.likes += 1;
                        likesLabel.textContent = `${c.likes} ♥`;
                    } catch (err) { console.error(err); }
                });
                footer.appendChild(likesLabel);
                footer.appendChild(likeBtn);

                body.appendChild(nameEl);
                body.appendChild(compEl);
                body.appendChild(footer);

                card.appendChild(tw);
                card.appendChild(body);

                // 詳細表示はとりあえず後回し
                card.addEventListener("click", () => {
                    alert(`${c.name} / ${c.company}`);
                });

                grid.appendChild(card);
            });
        }

        function setupSearchAndSort() {
            const sIn = $("#searchInput");
            const cSel = $("#categorySelect");
            const sortSel = $("#sortSelect");
            if (sIn) sIn.addEventListener("input", e => {
                currentSearch = e.target.value || ""; renderGrid();
            });
            if (cSel) cSel.addEventListener("change", e => {
                currentCategory = e.target.value || ""; renderGrid();
            });
            if (sortSel) sortSel.addEventListener("change", e => {
                currentSort = e.target.value || "newest"; renderGrid();
            });
        }

        (function init() {
            setupSearchAndSort();
            loadCreators();  // ログイン無しで即読み込む
        })();
    </script>
</body>

</html>
