<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CREATORS’ GUILD COLLECTIVE — Creator's Voice</title>

    <style>
        :root {
            --bg: #0b0c10;
            --card: #11131aee;
            --border: #ffffff20;
            --text: #eaeef6;
            --muted: #9ca3af;
            --accent: #ffb457;
            --accent2: #ff8c37;
            --danger: #ff6b6b;
            --radius: 22px;
            --shadow: 0 10px 30px rgba(0, 0, 0, .35),
                inset 0 1px 0 rgba(255, 255, 255, .04);
            --glow: 0 0 22px #ffb457aa,
                0 0 46px #ff8c37aa,
                0 0 80px #ff6a00aa;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, "Noto Sans JP", sans-serif;
            color: var(--text);
            background: var(--bg);
            overflow-x: hidden;
        }

        /* 背景レイヤー */
        #particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(1200px 1200px at 10% 10%, #1b2540 0%, transparent 60%),
                radial-gradient(1000px 900px at 90% 20%, #3b1a4b 0%, transparent 65%),
                radial-gradient(900px 1000px at 50% 100%, #093a47 0%, transparent 55%),
                var(--bg);
        }

        .grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .09;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="120" height="120" filter="url(%23n)" opacity="0.6"/></svg>');
            mix-blend-mode: overlay;
        }

        /* ハンバーガーメニュー */
        .menu-button {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            z-index: 1000;
        }

        .menu-button .bar {
            height: 3px;
            border-radius: 999px;
            background: #e5e7eb;
            box-shadow: 0 0 8px rgba(0, 0, 0, .6);
            transition: transform .25s ease, opacity .25s ease;
        }

        .menu-button.active .bar:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .menu-button.active .bar:nth-child(2) {
            opacity: 0;
        }

        .menu-button.active .bar:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        .menu-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .88);
            backdrop-filter: blur(18px);
            z-index: 900;
        }

        .menu-overlay.show {
            display: flex;
        }

        .menu-panel {
            width: min(360px, 90vw);
            border-radius: 24px;
            background: rgba(15, 23, 42, .96);
            border: 1px solid #ffffff22;
            padding: 20px 20px 18px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .9);
        }

        .menu-panel h2 {
            margin: 0 0 12px;
            font-size: 16px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: #e5e7eb;
        }

        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-list li a {
            display: block;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #1f2937;
            background: radial-gradient(circle at 0% 0%, rgba(251, 191, 36, 0.15), transparent 60%);
            color: #e5e7eb;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: .04em;
            transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
        }

        .menu-list li a:hover {
            background: radial-gradient(circle at 0% 0%, rgba(251, 191, 36, 0.25), transparent 70%);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .5);
        }

        /* HEADER */
        header {
            padding: 40px 24px 10px;
            text-align: center;
            position: relative;
        }

        .title {
            font-weight: 900;
            letter-spacing: .18em;
            font-size: clamp(26px, 5vw, 54px);
            text-transform: uppercase;
            filter: drop-shadow(0 6px 26px rgba(0, 0, 0, .5));
            animation: float 6.8s ease-in-out infinite,
                glow 2.6s ease-in-out infinite;
        }

        .subtitle {
            margin-top: 6px;
            font-weight: 300;
            letter-spacing: .14em;
            color: var(--muted);
        }

        .jpcopy {
            max-width: 860px;
            margin: 18px auto 30px;
            padding: 18px;
            border-radius: var(--radius);
            backdrop-filter: blur(14px);
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            font-size: 15.5px;
            line-height: 1.85;
            opacity: 0;
            transform: translateY(14px);
            animation: introCopy .9s ease-out .35s forwards;
        }

        @keyframes introCopy {
            0% {
                opacity: 0;
                transform: translateY(14px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }

            100% {
                transform: translateY(0);
            }
        }

        @keyframes glow {

            0%,
            100% {
                text-shadow: var(--glow);
            }

            50% {
                text-shadow: 0 0 10px #ffb45755,
                    0 0 < !--=============================--> < !-- PART2: Creators 読み込み & GRID 描画 --> < !--=============================--> <script type="module" >
                    /* Firestore 関連の import は前パートにて済 */

                    let creators=[];
                let currentSort="newest";
                let currentSearch="";
                let currentCategory="";
                let messagesUnsub=null;

                /* -----------------------------------
      Firestore から creators を取得
  ----------------------------------- */
                async function loadCreators() {
                    const snap=await getDocs(collection(db, "creators"));
                    const list=[];

                    snap.forEach(docSnap=> {
                            const d=docSnap.data();

                            list.push({
                                id: docSnap.id,
                                name: d.name || "",
                                company: d.company || "",
                                url: d.url || "",
                                videoTitle: d.videoTitle || "",
                                summary: d.summary || "",
                                profileImageUrl: d.profileImageUrl || "",
                                videoUrl: d.videoUrl || "",
                                categories: Array.isArray(d.categories) ? d.categories : [],
                                likes: typeof d.likes==="number" ? d.likes : 0,
                                works: Array.isArray(d.works) ? d.works : [],
                                createdAt: d.createdAt || null
                            });
                    });

                creators=list;
                rebuildCategoryOptions();
                renderGrid();
            }

            /* -----------------------------------
      カテゴリーの選択肢を再構築
  ----------------------------------- */
            function rebuildCategoryOptions() {
                const sel=$("#categorySelect");
                if ( !sel) return;

                const set=new Set();

                creators.forEach(c=> {
                        (c.categories || []).forEach(cat=> {
                                const t=(cat || "").trim();
                                if (t) set.add(t);
                            });
                    });

                sel.innerHTML='<option value="">すべてのカテゴリ</option>';

                [...set].sort().forEach(cat=> {
                        const opt=document.createElement("option");
                        opt.value=cat;
                        opt.textContent=cat;
                        sel.appendChild(opt);
                    });
            }

            /* -----------------------------------
      並び替え
  ----------------------------------- */
            function sortCreators(list) {
                const arr=list.slice();

                if (currentSort==="name-asc") {
                    arr.sort((a, b)=> (a.name||"").localeCompare(b.name||""));
                }

                else if (currentSort==="name-desc") {
                    arr.sort((a, b)=> (b.name||"").localeCompare(a.name||""));
                }

                else if (currentSort==="oldest") {
                    arr.sort((a, b)=> {
                            const ta=a.createdAt?.toMillis?.() || 0;
                            const tb=b.createdAt?.toMillis?.() || 0;
                            return ta - tb;
                        });
                }

                else {

                    // newest
                    arr.sort((a, b)=> {
                            const ta=a.createdAt?.toMillis?.() || 0;
                            const tb=b.createdAt?.toMillis?.() || 0;
                            return tb - ta;
                        });
                }

                return arr;
            }

            /* -----------------------------------
      GRID の描画
  ----------------------------------- */
            function renderGrid() {
                const grid=$("#grid");
                grid.innerHTML="";

                const s=(currentSearch || "").toLowerCase();

                let filtered=creators.filter(c=> {
                        const nm=(c.name || "").toLowerCase();
                        const cats=Array.isArray(c.categories) ? c.categories : [];

                        const okName= !s || nm.includes(s);
                        const okCat= !currentCategory || cats.includes(currentCategory);

                        return okName && okCat;
                    });

                filtered=sortCreators(filtered);

                if ( !filtered.length) {
                    grid.innerHTML='<div style="padding:20px 0;text-align:center;color:#9ca3af;font-size:13px;">該当するクリエーターがいません。</div>';
                    return;
                }

                filtered.forEach(c=> {
                        const card=document.createElement("div");
                        card.className="card";

                        /* ---------- サムネ ------------- */
                        const tw=document.createElement("div");
                        tw.className="thumb-wrap";

                        if (c.profileImageUrl) {
                            const img=document.createElement("img");
                            img.src=c.profileImageUrl;
                            img.alt=c.name || "thumbnail";
                            img.className="thumb";
                            tw.appendChild(img);
                        }

                        else {
                            const fb=document.createElement("div");
                            fb.className="thumb-fallback";
                            tw.appendChild(fb);
                        }

                        const title=document.createElement("div");
                        title.className="thumb-title";
                        title.textContent=c.videoTitle || c.name || "Untitled";
                        tw.appendChild(title);

                        /* ---------- 本文 ------------- */
                        const body=document.createElement("div");
                        body.className="card-body";

                        if (Array.isArray(c.categories) && c.categories[0]) {
                            const chip=document.createElement("div");
                            chip.className="category-chip";
                            chip.textContent=c.categories[0];
                            body.appendChild(chip);
                        }

                        const nameEl=document.createElement("div");
                        nameEl.className="creator-name";
                        nameEl.textContent=c.name || "—";

                        const compEl=document.createElement("div");
                        compEl.className="creator-company";
                        compEl.textContent=c.company || "";

                        /* ---------- footer（いいね） ----- */
                        const footer=document.createElement("div");
                        footer.className="card-footer";

                        const likesLabel=document.createElement("span");

                        likesLabel.textContent=`$ {
                            c.likes
                        }

                        ♥`;

                        const likeBtn=document.createElement("button");
                        likeBtn.className="like-btn";
                        likeBtn.innerHTML='<span class="heart">👍</span> いいね';

                        likeBtn.addEventListener("click", async (e)=> {
                                e.stopPropagation();

                                try {
                                    await updateDoc(doc(db, "creators", c.id), {
                                        likes: increment(1)
                                    });
                                c.likes +=1;

                                likesLabel.textContent=`$ {
                                    c.likes
                                }

                                ♥`;
                            }

                            catch (err) {
                                console.error(err);
                                alert("いいねの送信に失敗しました");
                            }
                        });

                    footer.appendChild(likesLabel);
                    footer.appendChild(likeBtn);

                    body.appendChild(nameEl);
                    body.appendChild(compEl);
                    body.appendChild(footer);

                    card.appendChild(tw);
                    card.appendChild(body);

                    /* DETAIL を開く */
                    card.addEventListener("click", ()=> openDetail(c));

                    grid.appendChild(card);
                });
        }

        </body></html>
