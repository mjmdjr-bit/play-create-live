<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EDIT — PLAY. CREATE. LIVE.</title>

    <style>
        :root {
            --bg: #05060a;
            --card: #11131aee;
            --border: #ffffff22;
            --text: #eaeef6;
            --muted: #9aa3b2;
            --accent: #ffb457;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans JP", sans-serif;
            background: #020617;
            color: var(--text);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin: 0 0 8px;
        }

        .sub {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .box {
            background: var(--card);
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: 0 12px 36px rgba(0, 0, 0, .45);
            padding: 18px 18px 20px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #9ca3af;
        }

        input,
        textarea,
        select {
            width: 100%;
            margin-top: 4px;
            padding: 9px 10px;
            border-radius: 10px;
            border: 1px solid #1f2937;
            background: #020617;
            color: #e5e7eb;
            font-size: 13px;
            outline: none;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(255, 180, 87, .25);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width:720px) {
            .row {
                grid-template-columns: 1fr;
            }
        }

        .btn-row {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            padding: 9px 16px;
            border-radius: 999px;
            border: none;
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
            cursor: pointer;
        }

        #saveBtn {
            background: linear-gradient(135deg, #ffb457, #ff8c37);
            color: #111827;
            font-weight: 600;
            box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
        }

        #clearBtn {
            background: #111827;
            color: #e5e7eb;
            border: 1px solid #374151;
        }

        #cancelEditBtn {
            background: #111827;
            color: #f87171;
            border: 1px solid #b91c1c;
        }

        /* 一覧表示 */
        .list-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .creator-item {
            background: #020617;
            border-radius: 12px;
            border: 1px solid #1f2937;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }

        .creator-main {
            min-width: 0;
        }

        .creator-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .creator-company {
            font-size: 11px;
            color: #9ca3af;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cat-label {
            display: inline-block;
            margin-top: 4px;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid rgba(250, 204, 21, .5);
            background: rgba(250, 204, 21, .1);
            font-size: 10px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #facc15;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .creator-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .edit-btn {
            background: #111827;
            color: #e5e7eb;
            border: 1px solid #4b5563;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
        }

        .delete-btn {
            background: #b91c1c;
            color: #fee2e2;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
        }

        .small {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>CREATOR EDIT</h1>
        <div class="sub">
            PLAY. CREATE. LIVE. のクリエイター情報を管理するページです（管理者専用）。
        </div>

        <!-- 入力フォーム -->
        <div class="box">
            <h2 style="margin:0 0 8px;font-size:14px;">クリエイター情報</h2>
            <div class="small">※ 編集モードでは上書き保存、新規モードでは新規追加になります。</div>

            <label for="nameInput">氏名（Creator Name）</label>
            <input id="nameInput" type="text" placeholder="例： Daijiro Majima" />

            <label for="companyInput">会社名（Company）</label>
            <input id="companyInput" type="text" placeholder="例： TOPPAN Inc." />

            <label for="urlInput">URL（Web / SNS）</label>
            <input id="urlInput" type="text" placeholder="https://..." />

            <div class="row">
                <div>
                    <label for="videoTitleInput">動画タイトル（任意）</label>
                    <input id="videoTitleInput" type="text" placeholder="例： Space-CX Showreel" />
                </div>
                <div>
                    <label for="categoryInput">カテゴリ</label>
                    <select id="categoryInput">
                        <option value="">未選択</option>

                        <!-- 既存カテゴリ -->
                        <option value="CXプロデューサー">CXプロデューサー</option>
                        <option value="建築デザイナー">建築デザイナー</option>
                        <option value="インテリアデザイナー">インテリアデザイナー</option>
                        <option value="グラフィックデザイナー">グラフィックデザイナー</option>
                        <option value="デザインビルダー">デザインビルダー</option>
                        <option value="映像プロデューサー">映像プロデューサー</option>
                        <option value="プロデューサー">プロデューサー</option>
                        <option value="プランナー">プランナー</option>
                        <option value="エンジニア">エンジニア</option>
                        <option value="ミュージシャン">ミュージシャン</option>
                        <option value="アーティスト">アーティスト</option>

                        <!-- コック系追加 -->
                        <option value="鮨食人">鮨職人</option>
                        <option value="シェフ">シェフ</option>
                        <option value="料理人">料理人</option>

                        <!-- 追加5カテゴリ -->
                        <option value="ヘアメイクアーティスト">ヘアメイクアーティスト</option>
                        <option value="展示デザイナー">展示デザイナー</option>
                        <option value="アスリート">アスリート</option>
                        <option value="エンターテイナー">エンターテイナー</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
            </div>

            <label for="summaryInput">概要 / コメント</label>
            <textarea id="summaryInput" placeholder="このクリエイターについての説明"></textarea>

            <div class="row">
                <div>
                    <label for="profileImageInput">プロフィール画像（任意）</label>
                    <input id="profileImageInput" type="file" accept="image/*" />
                </div>
                <div>
                    <label for="videoInput">動画ファイル（任意 / MP4推奨）</label>
                    <input id="videoInput" type="file" accept="video/*" />
                </div>
            </div>

            <div class="btn-row">
                <button id="saveBtn">保存 / 追加</button>
                <button id="clearBtn" type="button">入力クリア</button>
                <button id="cancelEditBtn" type="button" style="display:none;">編集キャンセル</button>
            </div>
        </div>

        <!-- 一覧エリア -->
        <div class="box">
            <div class="list-title">登録済みクリエイター一覧</div>
            <div id="creatorList"></div>
            <div class="small">※ 編集ボタンでフォームに読み込み、保存すると上書きされます。</div>
        </div>

        <!-- ▼▼▼ PART2: Firebase & 編集ロジック ▼▼▼ -->
        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
            import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
            import {
                getFirestore,
                collection,
                addDoc,
                getDocs,
                getDoc,
                doc,
                deleteDoc,
                setDoc,
                serverTimestamp
            } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
            import {
                getStorage,
                ref,
                uploadBytes,
                getDownloadURL
            } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

            const firebaseConfig = {
                apiKey: "AIzaSyAA97KPsLsnHUg5G8Rtb7-3CwMJ1oynkVs",
                authDomain: "play-create-live.firebaseapp.com",
                databaseURL: "https://play-create-live-default-rtdb.firebaseio.com",
                projectId: "play-create-live",
                storageBucket: "play-create-live.firebasestorage.app",
                messagingSenderId: "143889321354",
                appId: "1:143889321354:web:3c2d16f5fd928ba10e0c73",
                measurementId: "G-ZFHF93QQCJ"
            };

            const ADMIN_EMAIL = "mjmdjr@gmail.com"; // 管理者メール

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            const storage = getStorage(app);

            const nameInput = document.getElementById("nameInput");
            const companyInput = document.getElementById("companyInput");
            const urlInput = document.getElementById("urlInput");
            const videoTitleInput = document.getElementById("videoTitleInput");
            const summaryInput = document.getElementById("summaryInput");
            const categoryInput = document.getElementById("categoryInput");
            const profileImageInput = document.getElementById("profileImageInput");
            const videoInput = document.getElementById("videoInput");

            const saveBtn = document.getElementById("saveBtn");
            const clearBtn = document.getElementById("clearBtn");
            const cancelEditBtn = document.getElementById("cancelEditBtn");
            const creatorList = document.getElementById("creatorList");

            let editingId = null;   // 編集中のドキュメントID
            let editingData = null;   // 編集前のデータ

            // 🔐 管理者チェック
            onAuthStateChanged(auth, user => {
                if (!user || user.email !== ADMIN_EMAIL) {
                    alert("このページは管理者専用です。TOP画面に戻ります。");
                    window.location.href = "index.html";
                } else {
                    loadCreators();
                }
            });

            // 画像アップロード（任意）
            async function uploadFileIfNeeded(fileInput, pathPrefix) {
                if (!fileInput || !fileInput.files || fileInput.files.length === 0) return null;
                const file = fileInput.files[0];
                const storageRef = ref(storage, `${pathPrefix}/${Date.now()}_${file.name}`);
                await uploadBytes(storageRef, file);
                return await getDownloadURL(storageRef);
            }

            // 入力フォームを空に
            function clearForm() {
                nameInput.value = "";
                companyInput.value = "";
                urlInput.value = "";
                videoTitleInput.value = "";
                summaryInput.value = "";
                categoryInput.value = "";
                if (profileImageInput) profileImageInput.value = "";
                if (videoInput) videoInput.value = "";

                editingId = null;
                editingData = null;
                cancelEditBtn.style.display = "none";
                saveBtn.textContent = "保存 / 追加";
            }

            clearBtn.addEventListener("click", () => {
                clearForm();
            });

            cancelEditBtn.addEventListener("click", () => {
                clearForm();
            });

            // クリエイター一覧読み込み
            async function loadCreators() {
                creatorList.innerHTML = "";
                const snap = await getDocs(collection(db, "creators"));
                if (snap.empty) {
                    creatorList.innerHTML = "<div style='font-size:12px;color:#9ca3af;'>まだ登録がありません。</div>";
                    return;
                }

                snap.forEach(docSnap => {
                    const d = docSnap.data();
                    const div = document.createElement("div");
                    div.className = "creator-item";

                    const name = d.name || "";
                    const company = d.company || "";
                    const cat = (d.categories && d.categories[0]) || "";

                    div.innerHTML = `
          <div class="creator-main">
            <div class="creator-name">${name}</div>
            <div class="creator-company">${company}</div>
            ${cat ? `<span class="cat-label">${cat}</span>` : ""}
          </div>
          <div class="creator-actions">
            <button class="edit-btn" data-edit-id="${docSnap.id}">編集</button>
            <button class="delete-btn" data-id="${docSnap.id}">削除</button>
          </div>
        `;

                    creatorList.appendChild(div);
                });

                // 編集ボタン
                document.querySelectorAll(".edit-btn").forEach(btn => {
                    btn.addEventListener("click", () => {
                        const id = btn.getAttribute("data-edit-id");
                        loadOneCreatorToForm(id);
                    });
                });

                // 削除ボタン
                document.querySelectorAll(".delete-btn").forEach(btn => {
                    btn.addEventListener("click", async () => {
                        const id = btn.getAttribute("data-id");
                        if (!confirm("このクリエイターを削除しますか？")) return;
                        await deleteDoc(doc(db, "creators", id));
                        loadCreators();
                    });
                });
            }

            // 単一クリエイターをフォームに読み込む（編集モード）
            async function loadOneCreatorToForm(id) {
                const ref = doc(db, "creators", id);
                const snap = await getDoc(ref);
                if (!snap.exists()) {
                    alert("該当のデータが見つかりません。");
                    return;
                }
                const d = snap.data();
                editingId = id;
                editingData = d;

                nameInput.value = d.name || "";
                companyInput.value = d.company || "";
                urlInput.value = d.url || "";
                videoTitleInput.value = d.videoTitle || "";
                summaryInput.value = d.summary || "";
                categoryInput.value = (d.categories && d.categories[0]) || "";

                if (profileImageInput) profileImageInput.value = "";
                if (videoInput) videoInput.value = "";

                saveBtn.textContent = "更新する";
                cancelEditBtn.style.display = "inline-flex";
            }

            // 保存 / 追加 ボタン
            saveBtn.addEventListener("click", async () => {
                const name = nameInput.value.trim();
                if (!name) {
                    alert("氏名は必須です。");
                    return;
                }

                const basePayload = {
                    name,
                    company: companyInput.value.trim(),
                    url: urlInput.value.trim(),
                    videoTitle: videoTitleInput.value.trim(),
                    summary: summaryInput.value.trim(),
                    categories: categoryInput.value ? [categoryInput.value] : [],
                };

                // 新規アップロードするファイル（任意）
                let profileUrl = editingData && editingData.profileImageUrl ? editingData.profileImageUrl : "";
                let videoUrl = editingData && editingData.videoUrl ? editingData.videoUrl : "";

                // 画像ファイルが選ばれていたらアップロード
                const newProfileUrl = await uploadFileIfNeeded(profileImageInput, "profiles");
                if (newProfileUrl) profileUrl = newProfileUrl;

                // 動画ファイルが選ばれていたらアップロード
                const newVideoUrl = await uploadFileIfNeeded(videoInput, "videos");
                if (newVideoUrl) videoUrl = newVideoUrl;

                const payload = {
                    ...basePayload,
                    profileImageUrl: profileUrl || "",
                    videoUrl: videoUrl || "",
                };

                try {
                    if (editingId) {
                        // 既存更新
                        await setDoc(doc(db, "creators", editingId), payload, { merge: true });
                        alert("クリエイター情報を更新しました。");
                    } else {
                        // 新規追加
                        await addDoc(collection(db, "creators"), {
                            ...payload,
                            createdAt: serverTimestamp(),
                            likes: 0,
                        });
                        alert("クリエイターを追加しました。");
                    }

                    clearForm();
                    loadCreators();
                } catch (e) {
                    console.error(e);
                    alert("保存中にエラーが発生しました。");
                }
            });
        </script>

</body>

</html>
