<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <title>EDIT — PLAY. CREATE. LIVE.</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        :root {
            --bg: #020617;
            --panel: #0b1120;
            --card: #020617;
            --border: #1f2937;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --accent: #ffb457;
            --accent2: #ff8c37;
            --danger: #f97373;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, "Noto Sans JP", sans-serif;
            background: radial-gradient(circle at 0 0, #1f2937, transparent 60%), #020617;
            color: var(--text);
        }

        header {
            padding: 16px 20px 8px;
            border-bottom: 1px solid #111827;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 16px;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        header .sub {
            font-size: 11px;
            color: var(--muted);
        }

        .btn-top {
            border: none;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            cursor: pointer;
            background: #111827;
            color: #e5e7eb;
            border: 1px solid #374151;
        }

        .layout {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr);
            gap: 12px;
            padding: 12px 16px 24px;
        }

        @media(max-width:900px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel);
            border-radius: var(--radius);
            border: 1px solid #111827;
            box-shadow: 0 18px 40px rgba(0, 0, 0, .6);
            padding: 12px 12px 16px;
        }

        .panel-title {
            font-size: 12px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        /* クリエイター一覧 */
        .list {
            max-height: 70vh;
            overflow-y: auto;
            margin-top: 4px;
            border-radius: 12px;
            border: 1px solid #111827;
            background: #020617;
        }

        .list-item {
            padding: 8px 10px;
            border-bottom: 1px solid #111827;
            font-size: 13px;
            cursor: pointer;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item:hover {
            background: #0f172a;
        }

        .list-item.active {
            background: #1f2937;
            border-left: 3px solid var(--accent);
            padding-left: 7px;
        }

        .list-item .name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .list-item .company {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* フォーム全体 */
        .form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .field-group {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 10px 12px 12px;
        }

        .field-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .field-label {
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .field-note {
            margin: 0;
            font-size: 11px;
            color: #6b7280;
        }

        .field-input {
            width: 100%;
            margin-top: 4px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #020617;
            color: var(--text);
            font-size: 13px;
            outline: none;
        }

        .field-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(255, 180, 87, .4);
        }

        textarea.field-input {
            min-height: 80px;
            resize: vertical;
        }

        select.field-input {
            padding-right: 24px;
        }

        .row-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        @media(max-width:800px) {
            .row-2 {
                grid-template-columns: 1fr;
            }
        }

        .btn-bar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 6px;
        }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #111827;
            font-weight: 600;
        }

        .btn-ghost {
            background: #020617;
            color: var(--text);
            border: 1px solid #374151;
        }

        .btn-danger {
            background: #7f1d1d;
            color: #fee2e2;
            border: 1px solid #fecaca44;
        }

        .small-text {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            color: #d1fae5;
            background: rgba(16, 185, 129, .15);
            border: 1px solid rgba(16, 185, 129, .4);
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>EDIT — PLAY. CREATE. LIVE.</h1>
            <div class="sub">クリエイター情報 & メイン動画 / WORKS の編集画面</div>
        </div>
        <button class="btn-top" onclick="location.href='index.html'">← TOPへ戻る</button>
    </header>

    <main class="layout">
        <!-- 左：クリエイター一覧 -->
        <section class="panel">
            <div class="field-header">
                <div class="panel-title">CREATORS</div>
                <button id="newCreatorBtn" class="btn btn-ghost" type="button">新規作成</button>
            </div>
            <div id="creatorList" class="list">
                <!-- JSで一覧を挿入 -->
            </div>
        </section>

        <!-- 右：編集フォーム -->
        <section class="panel">
            <div class="panel-title">DETAIL / EDIT</div>

            <form class="form" onsubmit="return false;">
                <!-- 基本情報 -->
                <div class="field-group">
                    <div class="field-header">
                        <span class="field-label">基本情報</span>
                    </div>
                    <div class="row-2">
                        <div>
                            <label class="field-label">名前</label>
                            <input id="nameInput" class="field-input" type="text" placeholder="例：Masahiro Kuwamoto" />
                        </div>
                        <div>
                            <label class="field-label">会社・肩書</label>
                            <input id="companyInput" class="field-input" type="text"
                                placeholder="例：GEOBRAIN / Creative Director" />
                        </div>
                    </div>

                    <label class="field-label" style="margin-top:10px;">Web / SNS URL</label>
                    <input id="urlInput" class="field-input" type="text" placeholder="https://..." />

                    <div class="row-2" style="margin-top:10px;">
                        <div>
                            <label class="field-label">メイン動画タイトル</label>
                            <input id="videoTitleInput" class="field-input" type="text"
                                placeholder="例：Challenge the Unknown." />
                        </div>
                        <div>
                            <label class="field-label">カテゴリ</label>
                            <select id="categoryInput" class="field-input">
                                <option value="">未選択</option>
                                <option value="CXプロデューサー">CXプロデューサー</option>
                                <option value="建築デザイナー">建築デザイナー</option>
                                <option value="インテリアデザイナー">インテリアデザイナー</option>
                                <option value="グラフィックデザイナー">グラフィックデザイナー</option>
                                <option value="映像プロデューサー">映像プロデューサー</option>
                                <option value="プロデューサー">プロデューサー</option>
                                <option value="プランナー">プランナー</option>
                                <option value="エンジニア">エンジニア</option>
                                <option value="ミュージシャン">ミュージシャン</option>
                                <option value="アーティスト">アーティスト</option>
                                <option value="ヘアメイクアーティスト">ヘアメイクアーティスト</option>
                                <option value="展示デザイナー">展示デザイナー</option>
                                <option value="アスリート">アスリート</option>
                                <option value="エンターテイナー">エンターテイナー</option>
                                <option value="クリエイティブビルダー">クリエイティブビルダー</option>
                                <option value="その他">その他</option>
                            </select>
                        </div>
                    </div>

                    <label class="field-label" style="margin-top:10px;">ABOUT（概要）</label>
                    <textarea id="summaryInput" class="field-input" placeholder="クリエイターのプロフィールや世界観など"></textarea>
                </div>

                <!-- プロフィール画像 -->
                <div class="field-group">
                    <div class="field-header">
                        <span class="field-label">プロフィール画像</span>
                    </div>
                    <input id="profileImageInput" class="field-input" type="file" accept="image/*" />
                    <p class="field-note">※正方形〜横長推奨。jpg / png など。</p>
                </div>

                <!-- メイン動画設定 -->
                <div class="field-group">
                    <div class="field-header">
                        <span class="field-label">メイン動画</span>
                        <span class="tag">MOV / MP4 / YouTube / Vimeo</span>
                    </div>

                    <label class="field-label">種類</label>
                    <select id="videoType" class="field-input">
                        <option value="">なし</option>
                        <option value="file">ファイル（mov / mp4）</option>
                        <option value="youtube">YouTube</option>
                        <option value="vimeo">Vimeo</option>
                    </select>
                    <p class="field-note">※いずれか1つを選択してください。</p>

                    <div id="videoFileRow" style="margin-top:8px;display:none;">
                        <label class="field-label">動画ファイル</label>
                        <input id="videoFile" type="file" class="field-input" accept="video/mp4,video/quicktime" />
                        <p class="field-note">※できるだけ軽いmp4 / movにしてからアップロードしてください。</p>
                    </div>

                    <div id="videoUrlRow" style="margin-top:8px;display:none;">
                        <label class="field-label">動画URL（YouTube / Vimeo）</label>
                        <input id="videoUrlInput" type="text" class="field-input"
                            placeholder="https://youtu.be/..., https://www.youtube.com/watch?v=..., https://vimeo.com/..." />
                    </div>
                </div>

                <!-- WORKS（1作品） -->
                <div class="field-group">
                    <div class="field-header">
                        <span class="field-label">WORKS（代表作 1点）</span>
                        <span class="tag">IMAGE / MOV / MP4 / YouTube / Vimeo</span>
                    </div>

                    <label class="field-label">作品タイトル</label>
                    <input id="workTitleInput" class="field-input" type="text"
                        placeholder="例：Lighting Installation 2024" />

                    <label class="field-label" style="margin-top:8px;">作品種別</label>
                    <select id="workTypeInput" class="field-input">
                        <option value="">未選択</option>
                        <option value="image">画像（jpg/pngなど）</option>
                        <option value="file">動画ファイル（mov/mp4）</option>
                        <option value="youtube">YouTube</option>
                        <option value="vimeo">Vimeo</option>
                    </select>

                    <div id="workFileRow" style="margin-top:8px;display:none;">
                        <label class="field-label">作品ファイル</label>
                        <input id="workFileInput" type="file" class="field-input"
                            accept="image/*,video/mp4,video/quicktime" />
                    </div>

                    <div id="workUrlRow" style="margin-top:8px;display:none;">
                        <label class="field-label">作品URL（YouTube / Vimeo / 画像URL）</label>
                        <input id="workUrlInput" type="text" class="field-input" placeholder="https://..." />
                    </div>
                </div>

                <div class="btn-bar">
                    <button id="deleteBtn" class="btn btn-danger" type="button">削除</button>
                    <button id="saveBtn" class="btn btn-main" type="button">保存</button>
                </div>
            </form>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            setDoc,
            addDoc,
            deleteDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import {
            getStorage,
            ref,
            uploadBytes,
            getDownloadURL
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAA97KPsLsnHUg5G8Rtb7-3CwMJ1oynkVs",
            authDomain: "play-create-live.firebaseapp.com",
            databaseURL: "https://play-create-live-default-rtdb.firebaseio.com",
            projectId: "play-create-live",
            storageBucket: "play-create-live.firebasestorage.app",
            messagingSenderId: "143889321354",
            appId: "1:143889321354:web:3c2d16f5fd928ba10e0c73",
            measurementId: "G-ZFHF93QQCJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const $ = (s) => document.querySelector(s);

        // DOM
        const creatorListEl = $("#creatorList");
        const newCreatorBtn = $("#newCreatorBtn");
        const saveBtn = $("#saveBtn");
        const deleteBtn = $("#deleteBtn");

        const nameInput = $("#nameInput");
        const companyInput = $("#companyInput");
        const urlInput = $("#urlInput");
        const videoTitleInput = $("#videoTitleInput");
        const summaryInput = $("#summaryInput");
        const categoryInput = $("#categoryInput");

        const profileImageInput = $("#profileImageInput");

        const videoTypeSel = $("#videoType");
        const videoFileRow = $("#videoFileRow");
        const videoFileInput = $("#videoFile");
        const videoUrlRow = $("#videoUrlRow");
        const videoUrlInput = $("#videoUrlInput");

        const workTitleInput = $("#workTitleInput");
        const workTypeInput = $("#workTypeInput");
        const workFileRow = $("#workFileRow");
        const workFileInput = $("#workFileInput");
        const workUrlRow = $("#workUrlRow");
        const workUrlInput = $("#workUrlInput");

        let creators = [];
        let currentId = null;
        let currentDoc = null; // Firestore上の既存データ

        /* ========= フォーム表示切り替え ========= */

        function onVideoTypeChange() {
            const type = videoTypeSel.value;
            if (type === "file") {
                videoFileRow.style.display = "block";
                videoUrlRow.style.display = "none";
            } else if (type === "youtube" || type === "vimeo") {
                videoFileRow.style.display = "none";
                videoUrlRow.style.display = "block";
            } else {
                videoFileRow.style.display = "none";
                videoUrlRow.style.display = "none";
            }
        }

        function onWorkTypeChange() {
            const type = workTypeInput.value;
            if (type === "image" || type === "file") {
                workFileRow.style.display = "block";
                workUrlRow.style.display = "none";
            } else if (type === "youtube" || type === "vimeo") {
                workFileRow.style.display = "none";
                workUrlRow.style.display = "block";
            } else {
                workFileRow.style.display = "none";
                workUrlRow.style.display = "none";
            }
        }

        if (videoTypeSel) videoTypeSel.addEventListener("change", onVideoTypeChange);
        if (workTypeInput) workTypeInput.addEventListener("change", onWorkTypeChange);

        /* ========= クリエイター一覧読み込み ========= */

        async function loadCreators() {
            const snap = await getDocs(collection(db, "creators"));
            creators = [];
            creatorListEl.innerHTML = "";
            snap.forEach(docSnap => {
                const d = docSnap.data();
                creators.push({ id: docSnap.id, data: d });
            });

            creators.sort((a, b) => (a.data.name || "").localeCompare(b.data.name || ""));

            if (!creators.length) {
                creatorListEl.innerHTML =
                    '<div class="list-item"><div class="name">まだ登録がありません</div></div>';
                return;
            }

            creators.forEach(c => {
                const item = document.createElement("div");
                item.className = "list-item";
                item.dataset.id = c.id;
                item.innerHTML = `
          <div class="name">${c.data.name || "(無名)"}</div>
          <div class="company">${c.data.company || ""}</div>
        `;
                item.addEventListener("click", () => selectCreator(c.id));
                creatorListEl.appendChild(item);
            });
        }

        function markActive(id) {
            [...creatorListEl.children].forEach(ch => {
                if (ch.dataset && ch.dataset.id === id) {
                    ch.classList.add("active");
                } else {
                    ch.classList.remove("active");
                }
            });
        }

        function clearForm() {
            currentId = null;
            currentDoc = null;
            markActive(null);

            nameInput.value = "";
            companyInput.value = "";
            urlInput.value = "";
            videoTitleInput.value = "";
            summaryInput.value = "";
            categoryInput.value = "";

            profileImageInput.value = "";

            videoTypeSel.value = "";
            videoFileInput.value = "";
            videoUrlInput.value = "";
            onVideoTypeChange();

            workTitleInput.value = "";
            workTypeInput.value = "";
            workFileInput.value = "";
            workUrlInput.value = "";
            onWorkTypeChange();
        }

        async function selectCreator(id) {
            const c = creators.find(x => x.id === id);
            if (!c) return;
            currentId = id;
            currentDoc = c.data;
            markActive(id);

            nameInput.value = c.data.name || "";
            companyInput.value = c.data.company || "";
            urlInput.value = c.data.url || "";
            videoTitleInput.value = c.data.videoTitle || "";
            summaryInput.value = c.data.summary || "";
            categoryInput.value = (Array.isArray(c.data.categories) && c.data.categories[0]) || "";

            // メイン動画の復元
            const v = c.data.video || null;
            if (v && v.type) {
                videoTypeSel.value = v.type;
                if (v.type === "file") {
                    videoUrlInput.value = "";
                } else {
                    videoUrlInput.value = v.url || "";
                }
            } else {
                videoTypeSel.value = "";
                videoUrlInput.value = "";
            }
            onVideoTypeChange();

            // WORKS の復元（1件目のみ）
            const works = Array.isArray(c.data.works) ? c.data.works : [];
            if (works[0]) {
                workTitleInput.value = works[0].title || "";
                workTypeInput.value = works[0].type || "";
                if (works[0].type === "image" || works[0].type === "file") {
                    workUrlInput.value = "";
                } else {
                    workUrlInput.value = works[0].url || "";
                }
            } else {
                workTitleInput.value = "";
                workTypeInput.value = "";
                workUrlInput.value = "";
            }
            onWorkTypeChange();
        }

        /* ========= アップロードヘルパー ========= */

        async function uploadProfileImageIfNeeded(creatorId, previousUrl) {
            const file = profileImageInput.files[0];
            if (!file) return previousUrl || null;

            const ext = file.name.split(".").pop() || "jpg";
            const fileRef = ref(storage, `creators/${creatorId}/profile.${ext}`);
            await uploadBytes(fileRef, file);
            return await getDownloadURL(fileRef);
        }

        async function buildMainVideoField(creatorId, previousVideo) {
            const type = videoTypeSel.value;

            if (!type) return null;

            if (type === "file") {
                const file = videoFileInput.files[0];

                if (!file && previousVideo && previousVideo.type === "file" && previousVideo.url) {
                    return previousVideo;
                }
                if (!file) return null;

                const ext = file.name.split(".").pop() || "mp4";
                const fileRef = ref(storage, `creators/${creatorId}/main-video.${ext}`);
                await uploadBytes(fileRef, file);
                const url = await getDownloadURL(fileRef);

                return { type: "file", url };
            }

            if (type === "youtube" || type === "vimeo") {
                const url = videoUrlInput.value.trim();
                if (!url) return null;
                return { type, url };
            }

            return null;
        }

        async function buildWorksField(creatorId, previousWorks) {
            const title = workTitleInput.value.trim();
            const type = workTypeInput.value;
            const previous = Array.isArray(previousWorks) ? previousWorks[0] : null;

            if (!title && !type) return [];

            let url = "";

            if (type === "image" || type === "file") {
                const file = workFileInput.files[0];

                if (!file && previous && previous.type === type && previous.url) {
                    url = previous.url;
                } else if (file) {
                    const ext = file.name.split(".").pop() || (type === "image" ? "jpg" : "mp4");
                    const fileRef = ref(storage, `creators/${creatorId}/work-main.${ext}`);
                    await uploadBytes(fileRef, file);
                    url = await getDownloadURL(fileRef);
                } else {
                    // fileが必須だが無い → 作品なし扱い
                    return [];
                }
            } else if (type === "youtube" || type === "vimeo") {
                const inputUrl = workUrlInput.value.trim();
                if (!inputUrl) return [];
                url = inputUrl;
            } else {
                return [];
            }

            return [{
                title,
                type,
                url
            }];
        }

        /* ========= 保存処理 ========= */

        async function saveCreator() {
            const name = nameInput.value.trim();
            if (!name) {
                alert("名前は必須です。");
                return;
            }

            // 先に doc を用意（新規の場合は addDoc で作ってしまう）
            let creatorId = currentId;
            let docRef;

            if (!creatorId) {
                const basePayload = {
                    name,
                    company: companyInput.value.trim(),
                    url: urlInput.value.trim(),
                    videoTitle: videoTitleInput.value.trim(),
                    summary: summaryInput.value.trim(),
                    categories: categoryInput.value ? [categoryInput.value] : [],
                    createdAt: serverTimestamp()
                };
                docRef = await addDoc(collection(db, "creators"), basePayload);
                creatorId = docRef.id;
            } else {
                docRef = doc(db, "creators", creatorId);
            }

            const prev = currentDoc || {};
            const previousVideo = prev.video || null;
            const previousWorks = prev.works || [];
            const previousProfile = prev.profileImageUrl || null;

            // プロフィール画像
            const profileImageUrl = await uploadProfileImageIfNeeded(creatorId, previousProfile);

            // メイン動画
            const video = await buildMainVideoField(creatorId, previousVideo);

            // WORKS（1件分）
            const works = await buildWorksField(creatorId, previousWorks);

            const payload = {
                name,
                company: companyInput.value.trim(),
                url: urlInput.value.trim(),
                videoTitle: videoTitleInput.value.trim(),
                summary: summaryInput.value.trim(),
                categories: categoryInput.value ? [categoryInput.value] : [],
                updatedAt: serverTimestamp()
            };

            if (profileImageUrl) payload.profileImageUrl = profileImageUrl;
            if (video) payload.video = video;
            else payload.video = null; // 明示的に無し

            payload.works = works; // 配列（0件も含めて上書き）

            await setDoc(docRef, payload, { merge: true });

            alert("保存しました。");

            currentId = creatorId;
            const snap = await getDocs(collection(db, "creators"));
            creators = [];
            snap.forEach(docSnap => {
                creators.push({ id: docSnap.id, data: docSnap.data() });
            });
            currentDoc = creators.find(x => x.id === creatorId)?.data || payload;

            await loadCreators();
            selectCreator(creatorId);
        }

        async function deleteCreator() {
            if (!currentId) {
                alert("削除対象が選択されていません。");
                return;
            }
            if (!confirm("本当にこのクリエイターを削除しますか？")) return;
            await deleteDoc(doc(db, "creators", currentId));
            alert("削除しました。");
            clearForm();
            await loadCreators();
        }

        /* ========= イベント登録 & 初期化 ========= */

        newCreatorBtn.addEventListener("click", clearForm);
        saveBtn.addEventListener("click", saveCreator);
        deleteBtn.addEventListener("click", deleteCreator);

        loadCreators();
    </script>
</body>

</html>
