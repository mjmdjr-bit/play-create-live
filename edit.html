<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EDIT — PLAY. CREATE. LIVE.</title>

    <style>
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0b0c10;
            color: #eaeef6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 80px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .form-box {
            background: rgba(17, 19, 26, 0.92);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid #ffffff22;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #9aa3b2;
        }

        input,
        textarea,
        select {
            width: 100%;
            margin-top: 6px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid #1f2937;
            background: #0f172a;
            color: #e5e7eb;
            font-size: 14px;
        }

        textarea {
            height: 110px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 18px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #ffb457, #ff8844);
            color: #111;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        }

        .list {
            margin-top: 40px;
        }

        .creator-item {
            background: rgba(20, 20, 30, 0.8);
            border: 1px solid #ffffff22;
            padding: 16px 20px;
            border-radius: 14px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .creator-item button {
            background: #ef4444;
            color: #fff;
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 8px;
        }

        /* カテゴリが見やすいように */
        .cat-label {
            display: inline-block;
            margin-top: 4px;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(255, 195, 80, 0.2);
            border: 1px solid rgba(255, 195, 80, 0.45);
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #facc15;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>CREATOR EDIT</h1>

        <div class="form-box">
            <label>氏名（Creator Name）</label>
            <input id="nameInput" type="text" placeholder="例： Daijiro Majima" />

            <label>会社名（Company）</label>
            <input id="companyInput" type="text" placeholder="例： TOPPAN Inc." />

            <label>URL（Web / SNS）</label>
            <input id="urlInput" type="text" placeholder="https://..." />

            <label>動画タイトル（任意）</label>
            <input id="videoTitleInput" type="text" placeholder="例： Space-CX Showreel" />

            <label>概要 / コメント</label>
            <textarea id="summaryInput" placeholder="このクリエイターについての説明"></textarea>

            <label>カテゴリ</label>
            <select id="categoryInput">
                <option value="">未選択</option>

                <!-- 既存 -->
                <option value="CXプロデューサー">CXプロデューサー</option>
                <option value="建築デザイナー">建築デザイナー</option>
                <option value="インテリアデザイナー">インテリアデザイナー</option>
                <option value="グラフィックデザイナー">グラフィックデザイナー</option>
                <option value="映像プロデューサー">映像プロデューサー</option>
                <option value="プロデューサー">プロデューサー</option>
                <option value="プランナー">プランナー</option>
                <option value="エンジニア">エンジニア</option>
                <option value="ミュージシャン">ミュージシャン</option>
                <option value="アーティスト">アーティスト</option>
                <option value="料理家">料理家</option>

                <!-- ★追加カテゴリ（コック系＋あなた追加の5種） -->
                <option value="コック">コック</option>
                <option value="シェフ">シェフ</option>
                <option value="料理人">料理人</option>

                <option value="ヘアメイクアーティスト">ヘアメイクアーティスト</option>
                <option value="展示デザイナー">展示デザイナー</option>
                <option value="アスリート">アスリート</option>
                <option value="エンターテイナー">エンターテイナー</option>
                <option value="その他">その他</option>
            </select>
            <label>プロフィール画像（任意）</label>
            <input id="profileImageInput" type="file" accept="image/*" />

            <label>動画ファイル（MP4/MOV 推奨）</label>
            <input id="videoInput" type="file" accept="video/*" />

            <button id="saveBtn">保存 / 追加</button>
        </div>

        <div class="list">
            <h2 style="margin-bottom:12px;">保存済みクリエイター一覧</h2>
            <div id="creatorList"></div>
        </div>
    </div>

    <!-- Firebase & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
        import {
            getFirestore,
            collection,
            addDoc,
            getDocs,
            doc,
            deleteDoc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        import {
            getStorage,
            ref,
            uploadBytes,
            getDownloadURL
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAA97KPsLsnHUg5G8Rtb7-3CwMJ1oynkVs",
            authDomain: "play-create-live.firebaseapp.com",
            databaseURL: "https://play-create-live-default-rtdb.firebaseio.com",
            projectId: "play-create-live",
            storageBucket: "play-create-live.firebasestorage.app",
            messagingSenderId: "143889321354",
            appId: "1:143889321354:web:3c2d16f5fd928ba10e0c73",
            measurementId: "G-ZFHF93QQCJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const nameInput = document.getElementById("nameInput");
        const companyInput = document.getElementById("companyInput");
        const urlInput = document.getElementById("urlInput");
        const videoTitleInput = document.getElementById("videoTitleInput");
        const summaryInput = document.getElementById("summaryInput");
        const categoryInput = document.getElementById("categoryInput");

        const profileImageInput = document.getElementById("profileImageInput");
        const videoInput = document.getElementById("videoInput");

        const saveBtn = document.getElementById("saveBtn");
        const creatorList = document.getElementById("creatorList");

        // 🔐 管理者のみ利用可能
        const ADMIN_EMAIL = "mjmdjr@gmail.com";

        onAuthStateChanged(auth, user => {
            if (!user || user.email !== ADMIN_EMAIL) {
                alert("編集ページを利用するには管理者ログインが必要です。");
                window.location.href = "index.html";
            }
        });

        // ---------------------------
        //   保存処理
        // ---------------------------
        saveBtn.addEventListener("click", async () => {
            const name = nameInput.value.trim();
            if (!name) {
                alert("名前は必須です");
                return;
            }

            let profileImageUrl = "";
            let videoUrl = "";

            // 画像アップロード
            if (profileImageInput.files.length > 0) {
                const file = profileImageInput.files[0];
                const storageRef = ref(storage, "profiles/" + Date.now() + "_" + file.name);
                await uploadBytes(storageRef, file);
                profileImageUrl = await getDownloadURL(storageRef);
            }

            // 動画アップロード
            if (videoInput.files.length > 0) {
                const file = videoInput.files[0];
                const storageRef = ref(storage, "videos/" + Date.now() + "_" + file.name);
                await uploadBytes(storageRef, file);
                videoUrl = await getDownloadURL(storageRef);
            }

            await addDoc(collection(db, "creators"), {
                name,
                company: companyInput.value.trim(),
                url: urlInput.value.trim(),
                videoTitle: videoTitleInput.value.trim(),
                summary: summaryInput.value.trim(),
                categories: [categoryInput.value],  // ★ 1カテゴリ保持
                profileImageUrl,
                videoUrl,
                createdAt: serverTimestamp(),
                likes: 0,
            });

            alert("保存しました！");
            loadCreators();
        });

        // ---------------------------
        //   一覧読み込み
        // ---------------------------
        async function loadCreators() {
            creatorList.innerHTML = "";
            const snap = await getDocs(collection(db, "creators"));

            snap.forEach(docSnap => {
                const d = docSnap.data();

                const div = document.createElement("div");
                div.className = "creator-item";

                div.innerHTML = `
                          <div>
                            <div><strong>${d.name}</strong></div>
                            <div>${d.company || ""}</div>
                            <span class="cat-label">${(d.categories && d.categories[0]) || ""}</span>
                          </div>
                          <button data-id="${docSnap.id}">削除</button>
                        `;

                creatorList.appendChild(div);
            });

            // 削除処理
            document.querySelectorAll(".creator-item button").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const id = btn.getAttribute("data-id");
                    if (confirm("このクリエイターを削除しますか？")) {
                        await deleteDoc(doc(db, "creators", id));
                        loadCreators();
                    }
                });
            });
        }

        loadCreators();
    </script>

</body>

</html>
