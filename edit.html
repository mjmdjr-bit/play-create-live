<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <title>EDIT — PLAY. CREATE. LIVE.</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        :root {
            --bg: #0b0c10;
            --card: #11131aee;
            --border: #ffffff20;
            --text: #eaeef6;
            --muted: #9aa3b2;
            --accent: #ffb457;
            --accent2: #ff8c37;
            --radius: 16px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, "Noto Sans JP", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: .08em;
            color: var(--accent);
        }

        .container {
            width: min(800px, 92vw);
            margin: 20px auto 40px;
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px 24px 30px;
            border: 1px solid var(--border);
        }

        h2 {
            font-size: 18px;
            margin-top: 26px;
            margin-bottom: 8px;
            color: var(--accent);
        }

        label {
            font-size: 12px;
            color: var(--muted);
            display: block;
            margin-top: 14px;
            margin-bottom: 4px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #020617;
            color: var(--text);
            font-size: 13px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            margin-top: 20px;
            width: 100%;
            padding: 10px 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #111;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
        }

        .top-btn {
            margin-top: 14px;
            background: #1f2937;
            color: #eaeaea;
        }

        .creator-list {
            margin-top: 30px;
            padding: 16px;
            background: #111827;
            border-radius: 12px;
            border: 1px solid #ffffff15;
        }

        .creator-item {
            padding: 12px;
            border-bottom: 1px solid #ffffff15;
            cursor: pointer;
        }

        .creator-item:last-child {
            border-bottom: none;
        }

        .works-block {
            margin-top: 10px;
            padding: 10px;
            background: #0f172a;
            border-radius: 10px;
        }

        .work-item {
            padding: 8px;
            background: #1e293b;
            border-radius: 10px;
            margin-top: 10px;
        }

        .delete-work {
            margin-top: 6px;
            font-size: 11px;
            padding: 4px 8px;
            background: #7f1d1d;
            border: none;
            border-radius: 8px;
            color: #fee;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>EDIT — Creator's Database</header>

    <div class="container">

        <button onclick="location.href='index.html'" class="btn top-btn">← TOPへ戻る</button>

        <h2>クリエイター編集</h2>

        <label>編集対象を選択</label>
        <div id="creatorList" class="creator-list">読み込み中…</div>

        <h2>クリエイター情報</h2>

        <label>名前</label>
        <input id="nameInput" type="text" />

        <label>会社・肩書</label>
        <input id="companyInput" type="text" />

        <label>URL（任意）</label>
        <input id="urlInput" type="text" placeholder="https://〜" />

        <label>動画タイトル</label>
        <input id="videoTitleInput" type="text" />

        <label>解説（ABOUT）</label>
        <textarea id="summaryInput"></textarea>

        <label>プロフィール画像</label>
        <input id="profileImageInput" type="file" accept="image/*" />

        <label>動画ファイル（mp4 等）</label>
        <input id="videoInput" type="file" accept="video/*" />

        <label>カテゴリー</label>
        <select id="categorySelect" multiple size="8">
            <option>CXプロデューサー</option>
            <option>建築デザイナー</option>
            <option>インテリアデザイナー</option>
            <option>グラフィックデザイナー</option>
            <option>映像プロデューサー</option>
            <option>プロデューサー</option>
            <option>プランナー</option>
            <option>エンジニア</option>
            <option>ミュージシャン</option>
            <option>アーティスト</option>
            <option>ヘアメイクアーティスト</option>
            <option>展示デザイナー</option>
            <option>アスリート</option>
            <option>エンターテイナー</option>
            <option>クリエイティブビルダー</option>
            <option>その他</option>
        </select>

        <h2>WORKS（作品追加）</h2>

        <div id="worksArea" class="works-block"></div>

        <button onclick="addWork()" class="btn">作品を追加する</button>

        <button id="saveBtn" class="btn">保存する</button>

    </div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import {
            getFirestore, collection, getDocs, doc, updateDoc, addDoc, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
        import {
            getStorage, ref, uploadBytes, getDownloadURL
        } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAA97KPsLsnHUg5G8Rtb7-3CwMJ1oynkVs",
            authDomain: "play-create-live.firebaseapp.com",
            projectId: "play-create-live",
            storageBucket: "play-create-live.firebasestorage.app",
            messagingSenderId: "143889321354",
            appId: "1:143889321354:web:3c2d16f5fd928ba10e0c73"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let creators = [];
        let currentId = null;

        const creatorList = document.getElementById("creatorList");

        async function loadCreators() {
            const snap = await getDocs(collection(db, "creators"));
            creators = [];
            creatorList.innerHTML = "";

            snap.forEach(docSnap => {
                const d = docSnap.data();
                creators.push({ id: docSnap.id, ...d });

                const item = document.createElement("div");
                item.className = "creator-item";
                item.textContent = d.name || "(無名)";
                item.onclick = () => loadCreator(docSnap.id);
                creatorList.appendChild(item);
            });
        }

        loadCreators();


        function loadCreator(id) {
            currentId = id;
            const c = creators.find(x => x.id === id);
            if (!c) return;

            document.getElementById("nameInput").value = c.name || "";
            document.getElementById("companyInput").value = c.company || "";
            document.getElementById("urlInput").value = c.url || "";
            document.getElementById("videoTitleInput").value = c.videoTitle || "";
            document.getElementById("summaryInput").value = c.summary || "";

            const catSel = document.getElementById("categorySelect");
            [...catSel.options].forEach(o => o.selected = (c.categories || []).includes(o.value));

            renderWorksEditor(c.works || []);
        }

        function renderWorksEditor(list) {
            const area = document.getElementById("worksArea");
            area.innerHTML = "";

            list.forEach((w, i) => {
                const item = document.createElement("div");
                item.className = "work-item";

                item.innerHTML = `
        <label>作品タイトル</label>
        <input type="text" value="${w.title || ""}" data-work-title="${i}">

        <label>作品タイプ</label>
        <select data-work-type="${i}">
          <option value="image" ${w.type === "image" ? "selected" : ""}>Image</option>
          <option value="video" ${w.type === "video" ? "selected" : ""}>Video</option>
        </select>

        <label>URL</label>
        <input type="text" value="${w.url || ""}" data-work-url="${i}" placeholder="画像・動画URL">

        <button class="delete-work" onclick="deleteWork(${i})">削除</button>
      `;

                area.appendChild(item);
            });
        }

        window.deleteWork = (i) => {
            const c = creators.find(x => x.id === currentId);
            if (!c) return;
            c.works.splice(i, 1);
            renderWorksEditor(c.works);
        };

        window.addWork = () => {
            const c = creators.find(x => x.id === currentId);
            if (!c) return;
            c.works.push({ title: "", type: "image", url: "" });
            renderWorksEditor(c.works);
        };

        document.getElementById("saveBtn").onclick = async () => {
            if (!currentId) return alert("編集するクリエイターを選択してください");

            const name = document.getElementById("nameInput").value.trim();
            const company = document.getElementById("companyInput").value.trim();
            const url = document.getElementById("urlInput").value.trim();
            const videoTitle = document.getElementById("videoTitleInput").value.trim();
            const summary = document.getElementById("summaryInput").value.trim();

            const profileFile = document.getElementById("profileImageInput").files[0];
            const videoFile = document.getElementById("videoInput").files[0];

            const catSel = document.getElementById("categorySelect");
            const categories = [...catSel.options].filter(o => o.selected).map(o => o.value);

            const c = creators.find(x => x.id === currentId);

            const works = c.works.map((w, i) => {
                const t = document.querySelector(`[data-work-title="${i}"]`).value;
                const type = document.querySelector(`[data-work-type="${i}"]`).value;
                const u = document.querySelector(`[data-work-url="${i}"]`).value;
                return { title: t, type: type, url: u };
            });

            let profileUrl = c.profileImageUrl || "";
            if (profileFile) {
                const refImg = ref(storage, `profiles/${currentId}.jpg`);
                await uploadBytes(refImg, profileFile);
                profileUrl = await getDownloadURL(refImg);
            }

            let videoUrlVal = c.videoUrl || "";
            if (videoFile) {
                const refVid = ref(storage, `videos/${currentId}.mp4`);
                await uploadBytes(refVid, videoFile);
                videoUrlVal = await getDownloadURL(refVid);
            }

            await updateDoc(doc(db, "creators", currentId), {
                name, company, url,
                videoTitle, summary,
                categories,
                profileImageUrl: profileUrl,
                videoUrl: videoUrlVal,
                works: works,
                updatedAt: serverTimestamp()
            });

            alert("保存しました！");
        };

    </script>

</body>

</html>
